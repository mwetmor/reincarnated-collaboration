<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; media-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<title>Keeper cell review wheel</title>
<style>
body{margin:0;background:#171d27;color:#e7edf5;font:16px/1.5 system-ui}
main{max-width:1100px;margin:auto;padding:24px}button,a{color:#dcecff}
button{background:#29364a;border:1px solid #61718b;padding:10px;cursor:pointer;font:inherit}
button[aria-pressed=true]{background:#526d91;border-color:#c5ddff}
.layout{display:flex;gap:24px;flex-wrap:wrap}.wheel{display:grid;grid-template-columns:repeat(3,64px);gap:5px;margin:18px 0}
.wheel button[data-dir=N]{grid-area:1/2}.wheel button[data-dir=NE]{grid-area:1/3}
.wheel button[data-dir=E]{grid-area:2/3}.wheel button[data-dir=SE]{grid-area:3/3}
.wheel button[data-dir=S]{grid-area:3/2}.wheel button[data-dir=SW]{grid-area:3/1}
.wheel button[data-dir=W]{grid-area:2/1}.wheel button[data-dir=NW]{grid-area:1/1}
canvas,video{width:512px;max-width:100%;height:auto;background:#3a3f4a}
[hidden]{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202a39;padding:16px}
#reason{color:#ffd79e}#animations{display:flex;gap:6px;flex-wrap:wrap}
</style></head><body><main><h1>Keeper cell review wheel</h1>
<p>Offline cell playback and recorded measurements. No gameplay.</p>
<nav id="animations" aria-label="Animation"><button data-anim="idle">idle</button><button data-anim="walk">walk</button><button data-anim="run">run</button><button data-anim="jump">jump</button><button data-anim="cast">cast</button></nav>
<div class="layout"><section><div class="wheel" aria-label="Direction"><button data-dir="S">S</button><button data-dir="SW">SW</button><button data-dir="W">W</button><button data-dir="NW">NW</button><button data-dir="N">N</button><button data-dir="NE">NE</button><button data-dir="E">E</button><button data-dir="SE">SE</button></div>
<button id="play">Pause</button> <button id="restart">Restart</button>
<button id="previous">Previous frame</button> <button id="next">Next frame</button>
<p id="status" aria-live="polite"></p><p id="reason"></p></section>
<section><canvas id="frame" width="512" height="512" aria-label="Selected cell frame"></canvas>
<video id="video" controls muted playsinline preload="metadata" hidden></video></section></div>
<h2>Recorded numbers</h2><pre id="numbers"></pre><p id="numbers-link"></p>
<h2>Available cells</h2><ul><li>idle_E — 1 numbered PNGs at 8 fps</li><li>walk_E — 12 numbered PNGs at 12 fps</li></ul>
<script id="cell-data" type="application/json">{"idle_S": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "idle_SW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "idle_W": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "idle_NW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "idle_N": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "idle_NE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "idle_E": {"fps": 8, "frames": ["cells/idle_E/idle_E_00.png"], "numbers": [{"id": "fixture_frame_count", "subject": "idle/E", "passed": null, "value": 1, "threshold": null, "op": "report", "unit": "frames", "evidence": [], "notes": "Acceptance fixture only; no candidate gates recomputed."}], "numbers_path": "cells/idle_E/numbers.json"}, "idle_SE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "walk_S": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "walk_SW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "walk_W": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "walk_NW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "walk_N": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "walk_NE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "walk_E": {"fps": 12, "frames": ["cells/walk_E/walk_E_00.png", "cells/walk_E/walk_E_01.png", "cells/walk_E/walk_E_02.png", "cells/walk_E/walk_E_03.png", "cells/walk_E/walk_E_04.png", "cells/walk_E/walk_E_05.png", "cells/walk_E/walk_E_06.png", "cells/walk_E/walk_E_07.png", "cells/walk_E/walk_E_08.png", "cells/walk_E/walk_E_09.png", "cells/walk_E/walk_E_10.png", "cells/walk_E/walk_E_11.png"], "numbers": [{"id": "fixture_frame_count", "subject": "walk/E", "passed": null, "value": 12, "threshold": null, "op": "report", "unit": "frames", "evidence": [], "notes": "Acceptance fixture only; no candidate gates recomputed."}], "numbers_path": "cells/walk_E/numbers.json"}, "walk_SE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "run_S": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "run_SW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "run_W": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "run_NW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "run_N": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "run_NE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "run_E": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "run_SE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "jump_S": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "jump_SW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "jump_W": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "jump_NW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "jump_N": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "jump_NE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "jump_E": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "jump_SE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "cast_S": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "cast_SW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "cast_W": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "cast_NW": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "cast_N": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "cast_NE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "cast_E": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}, "cast_SE": {"reason": "Not included in the T3f two-cell acceptance fixture.", "numbers": []}}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('cell-data').textContent);
const $=id=>document.getElementById(id),ctx=$('frame').getContext('2d');
let anim='idle',direction='E',entry=null,frames=[],frame=0;
let elapsed=0,last=null,playing=true,generation=0;
const isLoop=()=>!['jump','cast'].includes(anim);
function showFrame(){
 ctx.clearRect(0,0,512,512);
 if(frames[frame])ctx.drawImage(frames[frame],0,0);
 $('status').textContent=anim+'_'+direction+(entry&&!entry.reason?' · '+entry.fps+' fps'+
 (entry.video?' · MP4 playback':' · frame '+frame+' / '+(frames.length-1)):' · missing');
}
function select(){
 const token=++generation;entry=data[anim+'_'+direction];frames=[];frame=0;elapsed=0;last=null;
 const video=$('video');video.pause();video.removeAttribute('src');video.load();
 video.hidden=true;$('frame').hidden=false;$('reason').textContent=entry.reason||'';
 $('numbers').textContent=JSON.stringify(entry.numbers??[],null,2);
 $('numbers-link').replaceChildren();
 if(entry.numbers_path){const a=document.createElement('a');a.href=entry.numbers_path;a.textContent='Numbers JSON';$('numbers-link').append(a);}
 document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===direction));
 document.querySelectorAll('[data-anim]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.anim===anim));
 for(const id of ['play','restart','previous','next'])$(id).disabled=Boolean(entry.reason);
 $('play').textContent=playing?'Pause':'Play';showFrame();
 if(entry.reason)return;
 if(entry.video){
  $('frame').hidden=true;video.hidden=false;video.loop=isLoop();video.src=entry.video;
  video.onerror=()=>{$('reason').textContent='Video could not load: '+entry.video;};
  if(playing)video.play().catch(()=>{$('reason').textContent='Use the video Play control to start playback.';});
 }else{
  Promise.all(entry.frames.map(path=>new Promise((resolve,reject)=>{
   const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error(path));im.src=path;
  }))).then(images=>{if(token===generation){frames=images;elapsed=0;last=null;showFrame();}})
  .catch(error=>{if(token===generation)$('reason').textContent='Frame could not load: '+error.message;});
 }
}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{direction=b.dataset.dir;select();});
document.querySelectorAll('[data-anim]').forEach(b=>b.onclick=()=>{anim=b.dataset.anim;select();});
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';
 if(entry.video){if(playing)$('video').play().catch(()=>{});else $('video').pause();}};
$('restart').onclick=()=>{elapsed=0;frame=0;last=null;if(entry.video)$('video').currentTime=0;showFrame();};
function step(delta){
 playing=false;$('play').textContent='Play';
 if(entry.video){$('video').pause();$('video').currentTime=Math.max(0,$('video').currentTime+delta/entry.fps);}
 else if(frames.length){frame=isLoop()?(frame+delta+frames.length)%frames.length:Math.max(0,Math.min(frames.length-1,frame+delta));elapsed=frame/entry.fps;showFrame();}
}
$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);
function tick(ms){
 if(last!==null&&playing&&frames.length){elapsed+=(ms-last)/1000;
  frame=isLoop()?Math.floor(elapsed*entry.fps)%frames.length:Math.min(frames.length-1,Math.floor(elapsed*entry.fps));showFrame();}
 last=ms;requestAnimationFrame(tick);
}
select();requestAnimationFrame(tick);
</script></main></body></html>
