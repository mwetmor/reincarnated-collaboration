    the intercalary sign that lies between the end of one cycle and the beginning of the next.
    The Elder Mother (Hyldemoer in Danish, Elder Queen in British tradition) is the guardian spirit
    of the elder tree; folk tradition requires asking her permission before cutting elder wood
    and absolutely forbids burning it (her screams will bring misfortune upon the house). Elder
    is simultaneously the medicine tree (elderflower for fever; elderberry for immune support,
    antiviral properties now studied clinically) and the mildly toxic one (all parts toxic raw;
    only safely consumed cooked or processed). In its hollow stems it echoes reed — another
    instrument material, another voice emerging from emptiness. At year's end, elder embodies
    the crone's wisdom: the complete knowledge of what has been, held in a small dark berry that
    contains both poison and medicine, both ending and the seed of the next year's beginning.
