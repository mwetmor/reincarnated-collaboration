    rotating eternally around Polaris (the North Star) like a clock hand. The two pointer stars
    (Dubhe and Merak) indicate Polaris with precision, making Ursa Major the primary navigation
    tool for Norse sailors. Viking navigation across the North Atlantic used this constellation
    and the position of the sun at noon; without it, the settlements of Iceland, Greenland, and
    Vinland would have been impossible to find reliably. The eternal wagon circling the pole is
    the sky's most permanent fixture — in northern Norway, it never disappears even in summer.
