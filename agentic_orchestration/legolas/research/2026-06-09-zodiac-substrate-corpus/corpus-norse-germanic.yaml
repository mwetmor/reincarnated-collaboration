  mythic_narrative: >
    Irminsul (Old Saxon "Irminsûl") was a great pillar — possibly a living tree — venerated by
    the Saxon peoples of continental Germany as the axis of the world, the column connecting
    earth and sky. Its name derives from "irmin" (great, universal) and "sul" (pillar, column).
    Charlemagne ordered its destruction in 772 CE during the forced Christianization of Saxony —
    a deliberate act of symbolic domination: cut the axis, collapse the cosmos, prove the old
    gods cannot protect their own most sacred object. The account survives in the Royal Frankish
    Annals. Irminsul is the closest Continental Germanic parallel to the Norse Yggdrasil, though
    the two are not identical; where Yggdrasil is a living ash tree in a complex mythological
    system, Irminsul appears to have been a physical object (or site) rather than a narrative
    figure. Its destruction left no written record of its mythology from practitioners — only
    Christian accounts of what was eliminated.
  cultural_sensitivity:
    flag_level: "none"
    notes: "The destruction of Irminsul is historical record; Neo-pagan reconstructionists have revived interest but the iconography is genuinely uncertain; documented clearly as reconstruction"
  provenance:
