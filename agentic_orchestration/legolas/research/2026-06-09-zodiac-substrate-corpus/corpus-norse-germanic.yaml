    Aurvandill (Old Norse) — cognate with Old English "Earendel" (meaning approximately "shining
    wanderer" or "dawn light") — is a dimly attested but evidently important figure in Germanic
    mythology. The name appears in Cynewulf's Old English poem 'Crist' (c. 800 CE) where Earendel
    is called "brightest of angels" — a pre-Christian stellar figure assimilated into Christian
    verse. In the Prose Edda (Skáldskaparmál), Þórr carries Aurvandill in a basket across the
    Élivágar (the primordial icy rivers of Niflheim) after rescuing him from the realm of the
    frost giants. Aurvandill's toe sticks out of the basket and freezes; Þórr breaks it off and
    throws it into the sky as a star called Aurvandilstá. The name captivated J.R.R. Tolkien,
    who made "Eärendil the Mariner" one of his mythology's central figures — the star-bearer
    whose light is bottled in the Phial of Galadriel, the last light in Sam's darkest hour.
