  mythic_narrative: >
    Máni (Old Norse for "Moon") is the male lunar deity of Norse mythology — another gender inversion
    relative to most Indo-European traditions where the moon is female. He drives the moon's chariot
    and was said to have abducted two children from Earth — Hjúki and Bil — who can be seen on the
    moon's face (the Man-in-the-Moon image). This abduction narrative is strikingly different from
    the usual moon-deity mythology; the children were taken while carrying a water bucket from a
    well, their names meaning "the waning" and "the waxing" in some interpretations, suggesting
    they personify the moon's phases. The wolf Hati (meaning "the One Who Hates") chases Máni's
    chariot eternally — the dark shadow that chases the moon from west to east across the sky.
    The word for "month" in all Germanic languages derives from "moon" (*mēnô), making Máni the
    father of measured time itself.
