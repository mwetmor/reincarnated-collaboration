    rune" containing all other runes within its structure when the six-rayed form is extended:
    by rotating and superimposing, all 24 Elder Futhark runes can be derived from it. The
    six-rayed star form migrated into Germanic folk tradition as the "Hexenstern" (hex star) —
    used on barn doors, house beams, and household objects throughout Alpine Germany and among
    Pennsylvania Dutch communities, where it served as a protective and luck-attracting symbol
    into the 20th century. The cosmic pattern hidden in disruption — the hailstone's geometry
    as seed-crystal of all form — positions Hagalaz as the Norse/Germanic equivalent of the
    cosmic matrix: the mother of patterns.
