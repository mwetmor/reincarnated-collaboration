    hidden cosmic pattern. In Germanic and Norse poetic tradition, hail is the "cold grain" or
    "white seed" (Old Norse rune poems call it: "Hail is the coldest of grains / Christ shaped
    the world in ancient times"). Its later Younger Futhark form transforms the angular H-rune
    into a six-rayed asterisk — literally the crystalline geometry of a snowflake, the most
