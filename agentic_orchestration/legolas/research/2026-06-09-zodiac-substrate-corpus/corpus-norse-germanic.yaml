  mythic_narrative: >
    Þjazi (the frost giant who kidnapped the goddess Iðunn and her apples of immortality) was
    slain by the Æsir when he pursued them in eagle-form. In the aftermath, Skaði (his daughter,
    who came to Ásgarðr to demand recompense for her father's death) was given the right to
    choose a husband from among the gods — choosing by feet alone, she picked the wrong pair.
    As additional recompense, Odin took Þjazi's eyes and threw them into the sky vault where
    they became two stars — Þjazi's Eyes. This act is framed as honorable recognition of the
    giant's power: too formidable to simply bury and forget, Þjazi's gaze is preserved in the
    sky. The myth encodes the Eddic theme that the boundary between Æsir (gods) and Jötnar
    (giants) is permeable — giants become stars, goddesses marry gods, the sky itself is made
    from a giant's skull. The cosmos is built from the bodies of the defeated.
