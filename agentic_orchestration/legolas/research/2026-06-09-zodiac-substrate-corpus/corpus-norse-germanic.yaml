  mythic_narrative: >
    Yggdrasill (the World Tree) is the central cosmographic structure of Norse mythology — a
    colossal ash tree whose three roots reach into Ásgarðr (the realm of gods and the Well of
    Urðr), Jötunheimr (the realm of giants and Mimir's Well of Wisdom), and Niflheim (the realm
    of ice and the dragon Níðhöggr). Nine worlds exist within and upon the tree. The name means
    "Odin's Horse" — euphemism for the gallows tree, on which Odin hung himself, pierced by his
    own spear, for nine days and nine nights without food or water to win the runes (the cosmic
    writing system containing all knowledge). The universe was created from the body of the giant
    Ymir, but it is sustained by the World Tree's structure. At Ragnarök, Níðhöggr's eternal
    gnawing finally weakens it and Yggdrasil shakes — but in the renewal after Ragnarök, the
    tree stands again and the surviving gods meet under its branches to remember and rebuild.
