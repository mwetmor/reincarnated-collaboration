  mythic_narrative: >
    Sól (Old Norse for "Sun") is the solar deity of Norse mythology — notably female in a tradition
    where the sun is male in most Indo-European systems (the German word "Sonne" is still grammatically
    feminine, preserving this ancient gender). She drives the sun's chariot across the sky, pulled
    by the horses Árvakr (Early Waker) and Alsviðr (All-Swift), who have bellows fixed to their
    shoulders to cool them from the sun's heat. The shield Svalinn rides before the chariot; without
    it, the sun's direct power would incinerate mountains and seas. The wolf Sköll chases her
    chariot eternally from east to west across the sky — in Eddic cosmology, this is why the sun
    appears to move: it is fleeing. At Ragnarök, Sköll catches her and devours her; but Sól's
    daughter, already born and learning her mother's paths, takes over and the sun continues.
    The Sowilo rune (ᛊ) encodes this solar force — victory, vitality, and the wheel of the sun
    whose spokes are its rays.
