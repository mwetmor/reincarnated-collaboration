        primary_stars:
          - name: "Altair (α Aquilae) — probable identification"
            ra: "19h 50m 47s"
            dec: "+08° 52′ 06″"
            magnitude: 0.77
            notes: >
              Hamacher (2012) identifies Warepil with Altair (α Aquilae) as
              the best stellar match for Stanbridge's (1857) description of
              Warepil's position in the sky. The IAU constellation Aquila
              (the Eagle) independently maps to approximately the same stellar
              region. Note: Western tradition also maps this area to an eagle,
              making this an interesting cross-cultural convergence.
        notes: >
          Cross-cultural note: α Aquilae = Altair is identified with an eagle
          in both Boorong tradition (Warepil, Wedge-tailed Eagle) and Western
          tradition (Aquila, the Eagle). This is an independent convergence,
          not derivation.
      asterism_schematic:
        description: >
          Single bright star identification. The Wedge-tailed Eagle (Warepil)
          is associated primarily with Altair in the Aquila region. Not an
          extended multi-star asterism in the Boorong tradition as documented.
        line_topology: "Single star (Altair)"
      cultural_iconography:
        description: >
          Warepil the Wedge-tailed Eagle (Aquila audax) is one of the most
          powerful animals in many Australian Aboriginal cultures, including
          the Wotjobaluk (Boorong). The Wedge-tailed Eagle is the largest
          bird of prey in Australia. Its association with the bright summer
          star Altair connects eagle-watching seasons to sky-watching practice.
          Stanbridge (1857) recorded Warepil as a named Boorong sky-figure;
          Hamacher (2012) assigned the Altair identification through positional
          analysis.
        reference_sources:
          - "Stanbridge, W.E. (1857). Transactions of the Philosophical
             Institute of Victoria."
          - "Hamacher, D.W. (2012). PhD thesis, Macquarie University."
        reference_urls:
