  - sign_id: "aboriginal-kamilaroi-001"
    sign_name:
      primary: "Emu in the Sky"
      variants:
        - "Dark Emu (modern common name popularised by Bruce Pascoe)"
        - "Kamilaroi Emu dark-cloud constellation"
      romanization: "Emu in the Sky"
      native_script: ""
      # Note: Kamilaroi language term not confirmed in Hamacher & Frew (2010) source
      # consulted; native-language name excluded to avoid misattribution
    cultural_tradition:
      primary_culture: "Kamilaroi"
      derivative_cultures:
        - "Multiple southeastern and central Australian Aboriginal peoples share
           dark-emu sky-reading; each is a distinct people. This entry documents
           the Kamilaroi instance as per Hamacher & Frew (2010)."
      geographic_origin: "New South Wales / Southern Queensland, Australia"
      period_range: >
        Continuous living tradition; documented in European academic record from
        1850s contact-era observation; practice pre-dates European contact by
        thousands of years.
      status_in_modern_tradition: "active_living"
    system_metadata:
      system_name: "Kamilaroi sky-tradition"
      total_signs_in_system: 0
      # Not a fixed-count system; sky knowledge is integrated into seasonal practice
      position_in_system: 1
      sign_classification:
        element: ""
        modality: ""
        quadrant: ""
        deity_association: ""
        season: >
          Autumn–Winter visibility (Southern Hemisphere): the emu figure
          appears horizon-ready in April–May, correlating with emu egg-laying
          season. Orientation shifts indicate progression through emu life cycle.
        other:
          constellation_type: "dark_cloud"
          milky_way_region: "Coalsack Nebula to Galactic center (RA 12h–18h)"
          seasonal_use: >
            Emu orientation in the sky indicates when emus on the ground are
            nesting and eggs are available for gathering — a practical
            ethnoastronomical calendar documented by Hamacher & Frew (2010).
    visual_representation:
      image_url:
        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Emu_in_the_sky.jpg/1200px-Emu_in_the_sky.jpg"
        description: >
          Milky Way photograph with the Emu in the Sky dark-cloud figure
          annotated; the Coalsack Nebula (adjacent to the Southern Cross)
          forms the emu's head; the body extends along the dark rift.
        source: "Wikipedia Commons"
        license: "CC-BY-SA"
        verified_loads: true
      image_url_secondary:
        - url: "https://en.wikipedia.org/wiki/Emu_in_the_Sky"
          description: "Wikipedia article with academic source citations"
          source: "Wikipedia"
          license: "CC-BY-SA"
          verified_loads: true
      star_coordinates:
        coordinate_system: "IAU equatorial J2000"
        primary_stars:
          - name: "Coalsack Nebula (dark absorption nebula, head of emu)"
            ra: "12h 31m"
            dec: "−63°"
            magnitude: ~0
            notes: >
              The Coalsack is a dark nebula adjacent to the Southern Cross
              (Crux). It is the 'head' of the Emu; the emu's body is defined
              by the dark rift of the Milky Way extending northward through
              Centaurus and Scorpius toward Sagittarius. The entire figure is
              defined by darkness (interstellar dust clouds), NOT by bright
              stars — a dark-cloud constellation paradigm.
          - name: "Milky Way rift through Scorpius–Sagittarius"
            ra: "17h 00m"
            dec: "−30° to −45°"
            magnitude: 0
            notes: >
              The 'body' of the emu; the dark dust-lane running along the
              Milky Way through Scorpius and Sagittarius. The complete emu
              figure spans roughly RA 12h to 18h, Dec −60° to −30°.
        notes: >
          Dark-cloud constellation: defined by the absence of stars in the Milky
          Way rather than by bright star positions. Only visible in the Southern
          Hemisphere or from low Southern latitudes. The Coalsack Nebula is
          ~170 ly from Earth; the Milky Way rift is the galactic plane dust
          lane at ~1,000+ ly.
      asterism_schematic:
        description: >
          The Emu's head is the Coalsack dark nebula (Dec ~−63°, adjacent to
          Southern Cross). The neck is the dark lane between the Coalsack and
          the bright star Eta Carinae region. The body extends along the dark
          Milky Way rift through Centaurus and Scorpius (Dec ~−30° to −45°) to
          the Sagittarius star-cloud. The legs extend into the Scorpius dark
          rifts. Total figure spans ~90–100 degrees of arc.
        line_topology: >
          Not a line-topology (star-to-star connection) figure. Defined by dark
          rifts: Coalsack (head, Dec ~−63°) → dark lane through Centaurus →
          body through Scorpius–Sagittarius rift. Negative-space figure.
      cultural_iconography:
        description: >
          The Emu in the Sky is a practical ethnoastronomical calendar: when
          the emu figure appears 'running' (head tilted down toward horizon) in
          April–May (Southern Hemisphere autumn), emus on the ground are
          laying eggs — indicating harvest time for eggs. As the season
          progresses, the emu's posture in the sky changes, tracking the stages
          of emu nesting. The emu is both a food source and a culturally
          significant animal across many Australian Aboriginal peoples. This
          sky-emu mirrors the earth-emu's seasonal behaviour.
          Academic documentation: Hamacher & Frew (2010) is the primary
          peer-reviewed source; Norris & Hamacher (2011) provides the broader
          methodological context for Aboriginal Australian ethnoastronomy as a
          field.
        reference_sources:
          - "Hamacher, D.W. & Frew, D.J. (2010). An Aboriginal Australian
             Record of the Great Eruption of Eta Carinae. Journal of
             Astronomical History and Heritage, 13(3), 220–234."
          - "Norris, R.P. & Hamacher, D.W. (2011). The Astronomy of Aboriginal
             Australia. IAU Symposium 260."
          - "Wikipedia: Emu in the Sky"
        reference_urls:
          - "https://en.wikipedia.org/wiki/Emu_in_the_Sky"
    primitive_association_hints:
      suggested_element: "Earth"
      suggested_attribute: "Practical knowledge / seasonal rhythm"
      suggested_animal_form: "Emu (large flightless bird, Dromaius novaehollandiae)"
      suggested_object_form: ""
      symbolic_role: >
        Seasonal calendar marker; food-availability indicator; sky-emu
        mirroring earth-emu; emblem of place-based ecological knowledge
      mythic_narrative_summary: >
        The dark-cloud Emu in the Milky Way's dark rift serves as a practical
        ethnoastronomical calendar: the emu's orientation in the sky indicates
        the nesting season of emus on the ground. One of the most recognisable
        Aboriginal Australian astronomical figures because it uses negative
        space — darkness — rather than star-dot patterns. Documented by
        Hamacher & Frew (2010) in a peer-reviewed journal.
    semantic_vocabulary:
      symbolic_keywords:
        - "emu"
        - "dark cloud constellation"
        - "Southern Hemisphere"
        - "Milky Way rift"
        - "seasonal calendar"
        - "Coalsack Nebula"
        - "flightless bird"
        - "egg-laying"
        - "negative space"
        - "ethnoastronomical calendar"
      mythic_narrative: >
        The Kamilaroi Emu in the Sky is a dark-cloud constellation — its shape
        defined by the dark rifts of the Milky Way, where interstellar dust
        clouds absorb the light of background stars. The emu's head is the
        Coalsack Nebula, adjacent to the Southern Cross; its body extends along
        the dark lanes of the Milky Way through Centaurus and Scorpius. The
        constellation functions as a practical seasonal calendar: when the emu
        figure appears with its head tilted toward the horizon in April–May
        (Southern Hemisphere autumn), emus on the ground are nesting and eggs
        are available. Hamacher & Frew (2010) documented this astronomical use
        in the Journal of Astronomical History and Heritage. The emu is among
        the most recognisable of all Aboriginal Australian astronomical figures
        precisely because it uses negative space — darkness — rather than
        star-dot patterns, demonstrating a fundamentally different paradigm of
        sky-reading from Western constellation traditions.
      visual_motifs:
        - "dark rift in Milky Way"
        - "emu silhouette defined by darkness"
        - "Coalsack dark nebula as emu head"
        - "Southern Cross as adjacent landmark"
        - "seasonal rotation of emu posture"
    cultural_sensitivity:
      flag_level: "high"
      explanation: >
        Sourced from publicly-published academic ethnoastronomy: Hamacher &
        Frew (2010) 'An Aboriginal Australian Record of the Great Eruption of
        Eta Carinae' (Journal of Astronomical History and Heritage 13(3)); and
        Norris & Hamacher (2011) IAU Symposium 260; AIATSIS publicly-accessible
        records; Wikipedia citing these academic sources. Aboriginal sky-lore
        is country-specific (per-people); primary_culture specifies Kamilaroi.
        This entry documents only peer-reviewed academic material on publicly-
        shared sky knowledge. Sacred-restricted content excluded. The Emu in the
        Sky is among the most prominently publicly documented Australian
        Aboriginal astronomical figures in the academic ethnoastronomy
        literature.
      source_authorization: >
        Hamacher & Frew (2010) academic + Norris & Hamacher (2011) IAU
        Symposium + AIATSIS publicly-accessible + Wikipedia academic-cited
    provenance:
      primary_source_url: "https://en.wikipedia.org/wiki/Emu_in_the_Sky"
      secondary_sources:
        - "Hamacher, D.W. & Frew, D.J. (2010). An Aboriginal Australian Record
           of the Great Eruption of Eta Carinae. Journal of Astronomical History
           and Heritage, 13(3), 220–234."
        - "Norris, R.P. & Hamacher, D.W. (2011). The Astronomy of Aboriginal
           Australia. IAU Symposium 260."
        - "Hamacher, D.W. (2012). On the astronomical knowledge and traditions
           of Aboriginal Australians. PhD thesis, Macquarie University."
      academic_anchor: "Hamacher & Frew (2010) Journal of Astronomical History and Heritage"
      crawl_date: "2026-06-09"
      legolas_confidence: "high"

  - sign_id: "aboriginal-wotjobaluk-boorong-001"
    sign_name:
      primary: "Neilloan"
      variants:
        - "Mallee Fowl star"
        - "Lyra Mallee Fowl (Boorong)"
      romanization: "Neilloan"
      native_script: ""
      # Wotjobaluk language term from Stanbridge (1857) as transcribed;
      # spelling from Hamacher & Frew (2010)
    cultural_tradition:
      primary_culture: "Wotjobaluk (Boorong people)"
      derivative_cultures: []
      geographic_origin: "Victoria, southeastern Australia (Lake Tyrrell region)"
      period_range: >
        Documented by William Stanbridge (1857) from Wotjobaluk informants;
        pre-dates European contact. Living tradition; community engagement
        by Hamacher researchers (2012) for academic corroboration.
      status_in_modern_tradition: "active_living"
    system_metadata:
      system_name: "Boorong sky-tradition (Wotjobaluk)"
      total_signs_in_system: 0
      position_in_system: 1
      sign_classification:
        element: ""
        modality: ""
        quadrant: ""
        deity_association: ""
        season: >
          Neilloan (Mallee Fowl) — likely associated with the period when
          Mallee Fowl are active (spring nesting). Vega rises in mid-year
          evening sky in southern Australia.
        other:
          constellation_type: "bright_star"
          stellar_identification: "Possibly Vega (α Lyrae) per Hamacher (2012)"
          seasonal_use: >
            Mallee Fowl's rising in the evening indicates seasonal nesting
            behaviour of the bird; used as a practical calendar.
    visual_representation:
      image_url:
        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Mallee-fowl.jpg/1200px-Mallee-fowl.jpg"
        description: >
          Mallee Fowl (Leipoa ocellata) — the bird identified with the
          Neilloan star in Boorong tradition. Image for cultural-iconography
          reference; no annotated sky chart available for this specific figure.
        source: "Wikipedia Commons"
        license: "CC-BY-SA"
        verified_loads: true
      image_url_secondary: []
      star_coordinates:
        coordinate_system: "IAU equatorial J2000"
        primary_stars:
          - name: "Vega (α Lyrae) — probable identification"
            ra: "18h 36m 56s"
            dec: "+38° 47′ 01″"
            magnitude: 0.03
            notes: >
              Hamacher (2012) proposes Vega as the likely stellar identification
              for Neilloan, based on analysis of Stanbridge (1857) position
              descriptions. This is a probable academic identification, not
              definitively confirmed.
        notes: >
          Boorong stellar identifications from Stanbridge (1857) have been
          re-analysed by Hamacher & Frew (2010) and Hamacher (2012); some are
          tentative. Neilloan = Vega is the current best academic interpretation.
      asterism_schematic:
        description: >
          Single-star figure (or small group near Lyra). The Mallee Fowl
          (Neilloan) is associated with the star or stars of the Lyra region,
          most probably Vega. Not an extended asterism.
        line_topology: "Single star identification (Vega region)"
      cultural_iconography:
        description: >
          The Boorong (Wotjobaluk people) star-knowledge was documented by
          William Stanbridge in 1857 — the first systematic recording of
          Aboriginal Australian astronomy in academic literature. Stanbridge
          worked with Boorong informants in the Lake Tyrrell region of Victoria
          and published their sky-knowledge in the Transactions of the
          Philosophical Institute of Victoria. The Mallee Fowl (Neilloan) is
          a ground-nesting bird whose seasonal behaviour tracks with the
          visibility of its associated star. Hamacher & Frew (2010) and
          Hamacher (2012) re-examined and corroborated Stanbridge's identifications
          using modern stellar data.
        reference_sources:
          - "Stanbridge, W.E. (1857). On the Astronomy of the Aborigines of
             Victoria. Transactions of the Philosophical Institute of Victoria,
             2, 137–140."
          - "Hamacher, D.W. & Frew, D.J. (2010). Journal of Astronomical
             History and Heritage, 13(3), 220–234."
          - "Hamacher, D.W. (2012). PhD thesis, Macquarie University."
        reference_urls:
          - "https://en.wikipedia.org/wiki/Boorong_people"
    primitive_association_hints:
      suggested_element: "Earth"
      suggested_attribute: "Seasonal labour / nesting"
      suggested_animal_form: "Mallee Fowl (Leipoa ocellata)"
      suggested_object_form: ""
      symbolic_role: "Seasonal marker; ground-nesting bird mirrored in sky"
      mythic_narrative_summary: >
        Neilloan (Mallee Fowl) in the Lyra region marks the Mallee Fowl's
        nesting season in the Boorong (Wotjobaluk) sky-calendar. One of the
        Boorong star-figures documented by Stanbridge (1857) and re-analysed
        by Hamacher (2010, 2012).
    semantic_vocabulary:
      symbolic_keywords:
        - "Mallee Fowl"
        - "Boorong"
        - "Wotjobaluk"
        - "Vega"
        - "nesting season"
        - "ground-nesting bird"
        - "Stanbridge 1857"
        - "Victoria Australia"
        - "star calendar"
      mythic_narrative: >
        In the Boorong (Wotjobaluk people) sky-tradition of Victoria, Neilloan
        the Mallee Fowl is identified with the star Vega in the Lyra region.
        The Mallee Fowl is a ground-dwelling bird that builds large mound nests;
        its seasonal behaviour — mound-building, incubating, and hatching —
        tracks with the visibility of Neilloan in the evening sky. William
        Stanbridge recorded the Boorong sky-figures in 1857, making this one
        of the earliest documented Aboriginal Australian ethnoastronomical
        traditions in the European academic record. Duane Hamacher's 2012
        PhD thesis re-analysed all Stanbridge identifications against modern
        stellar catalogues to produce current best-estimate stellar matches.
      visual_motifs:
        - "Mallee Fowl silhouette"
        - "mound nest on ground"
        - "single bright star (Vega region)"
        - "evening sky of southern Australia"
    cultural_sensitivity:
      flag_level: "high"
      explanation: >
        Sourced from publicly-published academic ethnoastronomy: Stanbridge
        (1857) published in the Transactions of the Philosophical Institute of
        Victoria; Hamacher & Frew (2010) Journal of Astronomical History and
        Heritage; Hamacher (2012) PhD thesis Macquarie University; AIATSIS
        publicly-accessible records. Wotjobaluk (Boorong people) tradition
        documented from peer-reviewed academic publication. Sacred-restricted
        content excluded. Primary culture is Wotjobaluk — not "Aboriginal
        Australian."
      source_authorization: >
        Stanbridge (1857) + Hamacher & Frew (2010) academic + Hamacher (2012)
        PhD thesis + AIATSIS publicly accessible + Wikipedia academic-cited
    provenance:
      primary_source_url: "https://en.wikipedia.org/wiki/Boorong_people"
      secondary_sources:
        - "Stanbridge, W.E. (1857). On the Astronomy of the Aborigines of
           Victoria. Transactions of the Philosophical Institute of Victoria."
        - "Hamacher, D.W. & Frew, D.J. (2010). Journal of Astronomical History
           and Heritage, 13(3), 220–234."
        - "Hamacher, D.W. (2012). PhD thesis, Macquarie University."
      academic_anchor: "Stanbridge (1857) + Hamacher (2012)"
      crawl_date: "2026-06-09"
      legolas_confidence: "medium-high"
