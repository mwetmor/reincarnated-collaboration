      mythic_narrative_summary: >
        Warepil the Wedge-tailed Eagle is a Boorong (Wotjobaluk) sky-figure
        associated with Altair. The eagle is an apex predator in Australian
        skies; its sky-counterpart marks breeding seasons and the turning of
        the year.
    semantic_vocabulary:
