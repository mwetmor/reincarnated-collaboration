  semantic_vocabulary:
    symbolic_keywords: ["llama", "dark cloud", "Milky Way", "Andes", "water", "flood prevention", "pastoral", "Southern Hemisphere", "Coalsack", "Quechua", "dark rift"]
    mythic_narrative: "The Yacana is the principal dark-cloud constellation of Andean cosmology. Unlike most constellation traditions worldwide which trace patterns between star-points, Andean astronomers saw figures in the dark rifts of the Milky Way — the spaces between stars where interstellar dust clouds block the light of background stars. The Yacana llama's body spans the dark rift from near the Southern Cross's Coalsack Nebula toward the Galactic center. Its 'eyes' are identified with the bright stars α and β Centauri. In Inca and Quechua mythology, the Yacana descends to earth at midnight during the Pleiades' absence to drink from the sea, preventing floods. Llamas were central to Inca economy (wool, meat, transport, religious sacrifice), and their celestial counterpart governed pastoral prosperity and water cycles. Gary Urton documented this living tradition in his 1981 fieldwork at Misminay, Peru."
    visual_motifs: ["dark rift in Milky Way", "llama silhouette against stars", "Coalsack dark nebula", "α/β Centauri eye-stars", "Southern Hemisphere sky"]
