    star_coordinates:
      coordinate_system: "IAU equatorial J2000"
      primary_stars:
        - name: "α Centauri (Rigil Kentaurus) — Yacana's eye (one of a pair)"
          ra: "14h 39m 36.5s"
          dec: "−60° 50′ 02″"
          magnitude: -0.27
          notes: "One of the two 'eyes' of the Yacana llama. Nearest star system to Earth (4.24 light-years). Third-brightest star in the night sky. The two eyes are α and β Centauri flanking the llama's head."
        - name: "β Centauri (Hadar / Agena) — Yacana's second eye"
          ra: "14h 03m 49.4s"
          dec: "−60° 22′ 22″"
          magnitude: 0.61
          notes: "Second eye of the Yacana llama. Blue giant. α and β Centauri are the 'Pointer Stars' that also point toward the Southern Cross."
      notes: "The Yacana dark-cloud figure is defined primarily by the dark rift (absence of stars) in the Milky Way from near the Coalsack Nebula (adjacent to the Southern Cross, Dec ~−63°) toward the Galactic center (Sagittarius, Dec ~−29°). The 'eyes' (α and β Centauri) are the only star-point references — the body is purely the dark rift shape."
    asterism_schematic:
      description: "The Yacana llama is a dark-cloud constellation: its shape is the dark rift formed by interstellar dust lanes in the Milky Way. The llama's head appears near the Coalsack Nebula (adjacent to the Southern Cross); the body extends north (galacticward) along the dark lane toward the Galactic center in Sagittarius. The 'eyes' of the llama are the bright stars α and β Centauri, which flank the llama's head region. The entire figure spans approximately 40–50° of sky. Visible as a distinct shape only under dark skies with a clear Milky Way view."
      line_topology: "Not a line-topology figure — defined by dark rift shape: elongated dark region from Dec ~−63° (Coalsack) extending toward Galactic center (Dec ~−29° in Sagittarius direction); width ~5–10° of sky"
    cultural_iconography:
      description: "In Quechua cosmology, the Yacana is a divine dark llama who lives in the Milky Way and descends to earth at midnight during the Pleiades' absence (when the Pleiades are not visible) to drink from the sea, preventing floods. If a sleeping person is 'hugged' by the descending Yacana (i.e., their llama falls asleep under this constellation), the herd will be blessed. The llama was the most economically and spiritually significant animal of the Andean highlands — providing wool, meat, transport, and ritual sacrifice. Its celestial counterpart governed pastoral prosperity and water cycles. The Yacana's appearance and orientation in the sky were used to predict rainfall amounts and agricultural cycles for the coming year. Gary Urton's fieldwork in Misminay (Peru) in the 1970s documented the living tradition of dark-cloud constellation observation."
      reference_sources:
        - "Urton, Gary. At the Crossroads of the Earth and Sky: An Andean Cosmology. University of Texas Press, 1981."
        - "Wikipedia: Inca astronomy"
        - "Wikipedia: Dark nebula"
        - "Aveni, Anthony. Skywatchers of Ancient Mexico. 1980."
      reference_urls:
        - "https://en.wikipedia.org/wiki/Inca_astronomy"
        - "https://en.wikipedia.org/wiki/Gary_Urton"
