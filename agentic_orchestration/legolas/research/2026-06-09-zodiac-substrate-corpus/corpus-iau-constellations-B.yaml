    classical authors saw it as the head of the horse that sprang from Medusa's blood alongside
    Pegasus — the second, less magnificent animal born from the same source. Its Arabic name Kitalpha
    (α Equulei, 'the section of the horse') reflects how later astronomers understood it as a fragment
