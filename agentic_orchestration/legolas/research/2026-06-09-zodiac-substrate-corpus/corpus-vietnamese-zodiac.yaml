  semantic_vocabulary:
    symbolic_keywords: ["cat", "wood", "yin", "Vietnamese variant", "Mèo", "Mão", "lucky", "strength", "evil ward", "zodiac race", "rabbit substitute", "baby boom", "rice protector"]
    mythic_narrative: |
      The Cat (Mão / Mèo) is fourth in the Vietnamese zodiac and the tradition's single most celebrated distinction from the Chinese source. Where every other Chinese-derivative zodiac tradition (Japanese, Korean, Tibetan) retains the Rabbit at position 4, Vietnam substitutes the Cat.

      Two explanations are documented. The linguistic account: the Vietnamese reading of the 4th Earthly Branch character (卯, Mão) is phonetically close to the Vietnamese word for cat (Mèo), leading to a cultural drift where the character became associated with cats rather than rabbits in Vietnamese oral tradition.

      The mythological account: Vietnamese zodiac legend differs from the Chinese race story. In Chinese tradition, the Rat tricks the Cat into missing the boat race to the Jade Emperor, which is why Cat is excluded from the zodiac. In the Vietnamese version, the Cat successfully swims across and completes the race, earning fourth place — there is no Rabbit in Vietnamese mythology.

      Culturally, the Cat (Mèo) carries far more potency than the Chinese Rabbit it replaces. Cats are considered lucky and protective in Vietnamese folk belief — they ward off evil spirits and guard homes. Their practical role as ratcatchers protecting rice stores from rodents anchors this prestige in agricultural reality. The 2011 Year of the Cat triggered a documented baby boom in Vietnam, as parents sought the auspicious birth-year for their children. Mão/Mèo individuals are described as tranquil, realistic, intelligent, artistic — and possessed of inner strength that the gentle Rabbit association lacks.
