    cultural_iconography:
      description: |
        THE CAT-FOR-RABBIT SUBSTITUTION — the single most important and distinctive feature of the Vietnamese zodiac vs. all other Chinese-derivative traditions.

        LINGUISTIC ORIGIN: The Vietnamese word for the 4th Earthly Branch character (卯, Mão) sounds nearly identical to the Vietnamese word for cat (Mèo). This phonetic similarity is considered a primary factor in the substitution — the character 卯 in Vietnamese auditory culture became associated with Mèo (cat) rather than the Chinese tù (rabbit).

        MYTHOLOGICAL NARRATIVE (Vietnamese tradition): Vietnamese legend differs fundamentally from the Chinese account of the zodiac race. In the Chinese version, the cat is excluded because the Rat tricked it into missing the boat, allowing Rat to cross the river first and Cat to miss the race entirely. In the Vietnamese version, the cat DOES complete the race and earns fourth place — it is the rabbit that is absent. Vietnamese legend holds that the cat was able to swim and took fourth position. The cat is thus an honored participant, not an excluded one.

        WHAT CAT SYMBOLIZES IN VIETNAM (vs. Chinese Rabbit):
        - The Year of the Rabbit (Chinese) is associated with peace, mild temperament, and gentleness
        - The Year of the Cat (Vietnamese) is associated with strength, power, and LUCK — considered an extremely fortunate birth year
        - Cats are believed to ward off evil spirits and bad luck in Vietnamese folk belief
        - In the 2011 Year of the Cat, Vietnam recorded a baby boom — parents actively sought cat-year births for the luck association
        - Cats' practical importance in rice agriculture (catching rats that threaten grain stores) grounds their cultural prestige

        AGRICULTURAL SIGNIFICANCE: Vietnamese folk rhymes depict cats assisting farmers by chasing rats away from stored rice. Given the centrality of rice farming to Vietnamese culture, the cat's rat-catching function elevates it as a culturally necessary animal.

        PERSONALITY TRAITS: Mão/Mèo individuals are described as tranquil, realistic, intelligent, and artistic — sharing some traits with the Chinese Rabbit but with added strength and protective qualities.
      reference_sources: ["Wikipedia: Vietnamese zodiac", "Wikipedia: Cat (zodiac)"]
      reference_urls: ["https://en.wikipedia.org/wiki/Vietnamese_zodiac", "https://en.wikipedia.org/wiki/Cat_(zodiac)"]
