    mythic_narrative: "Hoku Pa'a (lit. 'fixed star') is the Hawaiian name for Polaris (α Ursae Minoris). While every other star appears to wheel across the sky as Earth rotates, Hoku Pa'a stands nearly motionless at the north celestial pole — the axis around which all other stars appear to turn. Hawaiian navigators used its altitude above the northern horizon to read their latitude: the star rises by one degree for every degree of northward travel, and sinks toward the horizon as they sail south. When Polaris disappears below the horizon entirely, the navigator knows they have crossed the equator into the Southern Hemisphere — entering Maori and Southern Pacific star territory."
