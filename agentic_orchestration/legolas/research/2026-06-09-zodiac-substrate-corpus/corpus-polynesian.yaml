    mythic_narrative_summary: "Hoku Pa'a (Polaris) is the 'fixed star' — it does not move as all other stars rotate around it. Hawaiian navigators tracked its altitude to measure latitude: rising as they sailed north, sinking as they sailed south. The still point at the center of the turning sky."
