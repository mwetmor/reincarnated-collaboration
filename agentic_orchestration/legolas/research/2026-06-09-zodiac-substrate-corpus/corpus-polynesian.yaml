    mythic_narrative: "Hokule'a is the Hawaiian name for Arcturus (α Boötis), the fourth-brightest star in the night sky. Its declination (+19°) closely matches the latitude of the Hawaiian archipelago (~19–21°N), making it the zenith star — the star that passes directly overhead — for Hawaiian observers. Traditional Hawaiian navigators used this as a primary latitude reference: when Hokule'a was at zenith overhead, they knew they were at Hawaiian latitudes. In 1976, the Polynesian Voyaging Society launched the Hōkūleʻa, a 62-foot double-hulled voyaging canoe named after this star, sailing from Hawaiʻi to Tahiti using only traditional Polynesian navigation methods. The voyage sparked a Hawaiian cultural renaissance. Nainoa Thompson, who became the leading Hawaiian navigator trained in traditional star-path methods, has explicitly shared the star's significance in PVS public materials."
