      description: "Hoku Pa'a (lit. 'fixed star' or 'immovable star') is the Hawaiian name for Polaris, the North Star. While all other stars appear to rotate around the night sky as Earth turns, Hoku Pa'a appears to stand still — the hub of the celestial wheel. Hawaiian navigators sailing north toward the Pacific Northwest or Alaska watched this star rise higher above the horizon, using its altitude to track their northward progress. Conversely, sailing south from Hawaii toward Tahiti or the equator, the star descends toward the horizon and eventually disappears below it — indicating the navigator has crossed into the Southern Hemisphere. The star's unique stationary quality made it a conceptually important anchor star even for primarily southward-sailing Hawaiian navigators."
