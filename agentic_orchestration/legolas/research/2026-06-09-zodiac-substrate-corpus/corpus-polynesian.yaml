      description: "Hokule'a (lit. 'star of gladness / star of clarity / joyful star') is the zenith star of the Hawaiian archipelago — when it passes directly overhead, the navigator knows they are at Hawaiian latitudes (~19–21°N). In traditional Hawaiian deep-ocean navigation, the zenith star was a primary latitude anchor: as a canoe sailed north or south, the navigator tracked which stars passed overhead, maintaining latitude by keeping target stars at zenith. Hokule'a was the homecoming star — when it rose to zenith, land was near. In 1976, the Polynesian Voyaging Society launched the 62-foot double-hulled voyaging canoe Hōkūleʻa (named for this star) and sailed from Hawaiʻi to Tahiti using only traditional Polynesian navigation: stars, ocean swells, wind, clouds, and birds. Navigator Mau Piailug (Satawalese) guided the first voyage; Nainoa Thompson trained under him and led subsequent voyages. The 1976 voyage sparked a Hawaiian and Pacific Islander cultural renaissance that continues today."
