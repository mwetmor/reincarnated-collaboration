      cultural_iconography:
        description: >
          In the Anishinaabe (Ojibwe) sky-tradition, the Fisher (pine marten
          / Martes pennanti — a large weasel-family member) is a heroic
          figure who makes a journey to the sky realm to steal summer and
          bring it back to the earth people, who are suffering under eternal
          winter. The Fisher succeeds in opening the sky-cage of summer,
          allowing warm air and birds to return, before being shot with an
          arrow and ascending permanently to become the stars of the Big
          Dipper (Ursa Major). The story explains the seasons: summer is now
          released each year through a hole in the sky-cage. Basil Johnston's
          "Ojibway Heritage" (1976) and academic Anishinaabe ethnographic
          sources document this story. The Fisher constellation's rotation
          through the year tracks seasonal change — when the Fisher 'falls'
          to the north (Dipper pointing down in winter), winter dominates;
          as the Fisher rises (Dipper pointing up in summer), summer arrives.
