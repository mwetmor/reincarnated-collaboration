# Each entry is per-tribe. Primary culture specifies the tribe.
# Sacred/restricted ceremonial astronomical knowledge is explicitly excluded.

entries:

  - sign_id: "native-american-pawnee-skidi-001"
    sign_name:
      primary: "Council of Chiefs (Corona Borealis)"
      variants:
        - "Pawnee Council of Chiefs"
        - "The Ring of Chiefs (Skidi Pawnee)"
      romanization: "Council of Chiefs"
      native_script: ""
      # Skidi Pawnee language term not confirmed in public sources; omitted
      # to avoid misattribution
    cultural_tradition:
      primary_culture: "Pawnee (Skidi Band)"
      derivative_cultures: []
      geographic_origin: "Loup River / Platte River region, Nebraska (Great Plains)"
      period_range: >
        Documented by von Del Chamberlain (1982) "When Stars Came Down to
        Earth"; Field Museum Star Chart (Catalog #16979); pre-dates European
        contact. Skidi Pawnee were known for the most elaborate star ceremonial
        tradition on the Great Plains.
      status_in_modern_tradition: "historical_documented"
      # Skidi Pawnee as a distinct ceremonial band is documented historically;
      # the Pawnee Nation continues as a living people (Pawnee Nation of
      # Oklahoma). Whether the specific star ceremonies remain actively
      # practiced is not confirmed in sources; marked as historical_documented.
    system_metadata:
      system_name: "Skidi Pawnee sky-tradition"
      total_signs_in_system: 0
      position_in_system: 1
      sign_classification:
        element: ""
        modality: ""
        quadrant: ""
        deity_association: "Stars are considered living beings who created the first humans in Skidi Pawnee cosmology"
        season: >
          Corona Borealis is visible in the evening sky from late spring
          through summer (Northern Hemisphere). For the Skidi Pawnee on the
          Great Plains, its appearance corresponds to the summer ceremonial
          season.
        other:
          constellation_type: "asterism"
          stellar_identification: "Corona Borealis (IAU constellation)"
          seasonal_use: >
            The Council of Chiefs (Corona Borealis) appears in the summer
            evening sky; its ceremonial use in Skidi Pawnee tradition is
            documented by Chamberlain (1982) in the context of the star-chart
            and star ceremonies.
    visual_representation:
      image_url:
        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Corona_Borealis_constellation_map.svg/1200px-Corona_Borealis_constellation_map.svg.png"
        description: >
          IAU star map of Corona Borealis — identified as the Council of
          Chiefs in Skidi Pawnee tradition. The semicircle of stars forms
          a natural 'ring' or 'council circle.'
        source: "Wikipedia Commons (IAU constellation map)"
        license: "CC-BY-SA"
        verified_loads: true
      image_url_secondary:
        - url: "https://en.wikipedia.org/wiki/Skidi_Pawnee"
          description: >
            Wikipedia article on Skidi Pawnee with links to Chamberlain
            (1982) and Field Museum star chart documentation.
          source: "Wikipedia"
          license: "CC-BY-SA"
          verified_loads: true
      star_coordinates:
        coordinate_system: "IAU equatorial J2000"
        primary_stars:
          - name: "Alphecca (α Coronae Borealis)"
            ra: "15h 34m 41s"
            dec: "+26° 42′ 53″"
            magnitude: 2.21
            notes: "Brightest star in Corona Borealis; the brightest point in the council circle"
          - name: "Nusakan (β Coronae Borealis)"
            ra: "15h 27m 50s"
            dec: "+29° 06′ 21″"
            magnitude: 3.65
          - name: "γ Coronae Borealis"
            ra: "15h 42m 45s"
            dec: "+26° 17′ 44″"
            magnitude: 3.83
          - name: "δ Coronae Borealis"
            ra: "15h 49m 36s"
            dec: "+26° 04′ 06″"
            magnitude: 4.63
          - name: "ε Coronae Borealis"
            ra: "15h 57m 36s"
            dec: "+26° 52′ 41″"
            magnitude: 4.15
          - name: "ι Coronae Borealis"
            ra: "16h 01m 27s"
            dec: "+29° 51′ 05″"
            magnitude: 4.99
          - name: "θ Coronae Borealis"
            ra: "15h 31m 49s"
            dec: "+31° 21′ 33″"
            magnitude: 4.14
        notes: >
          Corona Borealis forms a semicircular arc of ~7 stars (~Dec +26° to
          +31°), making it one of the most naturally circular asterisms in the
          sky. Its visual quality as a 'ring' or 'council circle' makes the
          Skidi Pawnee "Council of Chiefs" identification intuitively compelling.
          The arc spans approximately 20° in RA (15h 30m to 16h 00m).
      asterism_schematic:
        description: >
          A semicircular arc of ~7 stars (Alphecca at the centre of the arc
          is the brightest). The arc opens toward the south, forming a visual
          'U' or ring shape. The Skidi Pawnee read this as a council circle —
          a circle of chiefs gathered for council.
        line_topology: "Semicircular arc: θ → ι → β → α → γ → δ → ε (left to right)"
      cultural_iconography:
        description: >
          The Skidi Band of the Pawnee Nation (Nebraska) had the most
          elaborate star-ceremonial tradition on the Great Plains. Their
          sky-figures are documented on the Pawnee Star Chart (Field Museum
          Catalog #16979) — a physical star chart painted on elk hide, now
          held at the Field Museum in Chicago. Von Del Chamberlain's 1982
          book "When Stars Came Down to Earth" is the authoritative academic
          analysis of this chart and Skidi Pawnee astronomy.
          The Council of Chiefs is the Skidi Pawnee identification of Corona
          Borealis as a gathering of star-chiefs in council — consistent with
          Skidi Pawnee cosmology in which stars are living beings who created
          the first humans.
        reference_sources:
          - "Chamberlain, V.D. (1982). When Stars Came Down to Earth:
             Cosmology of the Skidi Pawnee Indians of North America.
             Ballena Press / Center for Archaeoastronomy."
          - "Field Museum of Natural History, Chicago. Skidi Pawnee Star
             Chart, Catalog #16979."
          - "Smithsonian National Museum of the American Indian (NMAI) —
             publicly accessible records on Pawnee astronomy."
          - "Wikipedia: Skidi Pawnee"
        reference_urls:
          - "https://en.wikipedia.org/wiki/Skidi_Pawnee"
          - "https://en.wikipedia.org/wiki/Pawnee_people"
