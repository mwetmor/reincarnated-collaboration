      mythic_narrative: >
        In the Skidi Pawnee sky-tradition, the semicircular arc of Corona
        Borealis is the Council of Chiefs — star-beings gathered in council.
        The Skidi Pawnee of the Great Plains (Nebraska) had the most
        elaborate star ceremonialism on the Plains; stars were not merely
        sky-objects but living beings who had created the first human beings
        and continued to influence life below. The Skidi Pawnee Star Chart
        (Field Museum Catalog #16979), painted on elk hide, is one of the
        few surviving Native American astronomical artefacts and demonstrates
        the sophistication of Skidi Pawnee sky-knowledge. Von Del Chamberlain's
        1982 analysis "When Stars Came Down to Earth" is the definitive
        academic study of this tradition.
      visual_motifs:
