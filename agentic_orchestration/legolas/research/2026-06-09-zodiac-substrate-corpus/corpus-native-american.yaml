        deity_association: ""
        season: >
          Pleiades is prominent in the winter sky from eastern North America.
          In Cherokee tradition, the Pleiades (Ani Tsutsa / The Boys) are
          associated with autumn / early winter.
        other:
          constellation_type: "open_cluster"
          stellar_identification: "Pleiades (M45)"
          seasonal_use: >
            Winter sky marker; seasonal story of the seven boys who ascended
            to become stars.
    visual_representation:
      image_url:
        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Pleiades_large.jpg/1200px-Pleiades_large.jpg"
        description: >
          The Pleiades star cluster (M45) — identified as Ani Tsutsa
          (The Boys / Seven Boys) in Cherokee tradition.
        source: "Wikipedia Commons"
        license: "CC-BY-SA"
        verified_loads: true
      image_url_secondary: []
      star_coordinates:
        coordinate_system: "IAU equatorial J2000"
        primary_stars:
          - name: "Pleiades cluster (M45)"
            ra: "03h 47m 00s"
            dec: "+24° 07′ 00″"
            magnitude: 1.6
            notes: >
              The Pleiades is documented across multiple Native American tribal
              traditions with different specific narratives; each is a distinct
              tribal reading. The Cherokee story of seven boys who became the
              Pleiades is documented in Mooney (1900) Bureau of American
              Ethnology and NMAI.
        notes: >
          Cross-tribal note: The Pleiades is documented in Cherokee, Pawnee,
          Lakota, Anishinaabe, and other tribal traditions with entirely distinct
          narratives. DO NOT conflate these — per Protocol C each is a separate
          per-tribe entry.
      asterism_schematic:
        description: >
          The Pleiades open cluster; seven principal naked-eye stars. The
          Cherokee identify the cluster with seven boys who ascended to become
          stars. The number seven matches the seven principal naked-eye stars
          of the cluster.
        line_topology: "Open cluster"
      cultural_iconography:
        description: >
          In the Cherokee tradition, Ani Tsutsa (The Boys) are seven young men
          who spent so much time dancing and neglecting their duties that they
          ascended into the sky and became the Pleiades. In some versions of
          the story, one of the seven boys fell back to earth and became a
          pine tree; the seven visible stars of the Pleiades correspond to
          the six who fully ascended (and sometimes the seventh dimmer star
          corresponds to the one who hesitated or was held back). James
          Mooney documented this story in "Myths of the Cherokee" (1900,
          Bureau of American Ethnology Report 19), which is the primary
          academic historical documentation. The NMAI (Smithsonian) holds
          additional Cherokee cultural records.
        reference_sources:
          - "Mooney, J. (1900). Myths of the Cherokee. Bureau of American
             Ethnology, Annual Report 19, Part I."
          - "Smithsonian National Museum of the American Indian (NMAI)"
          - "Cherokee Nation of Oklahoma — cultural educational materials"
          - "Wikipedia: Cherokee mythology"
        reference_urls:
          - "https://en.wikipedia.org/wiki/Cherokee_mythology"
          - "https://en.wikipedia.org/wiki/Pleiades_in_folklore_and_literature"
    primitive_association_hints:
      suggested_element: "Air / Sky"
      suggested_attribute: "Ascension / youth / transformation / neglect-consequence"
      suggested_animal_form: ""
      suggested_object_form: "Seven boys / seven stars"
      symbolic_role: >
        Boys who became stars; transformation myth; Pleiades origin story;
        cautionary narrative about neglecting responsibilities
      mythic_narrative_summary: >
        Ani Tsutsa (The Boys) is the Cherokee identification of the Pleiades
        as seven young men who ascended to become stars through dancing and
        neglecting their duties. One fell back as a pine tree; the six or
        seven who ascended became the Pleiades. Documented by Mooney (1900)
        and NMAI.
    semantic_vocabulary:
      symbolic_keywords:
        - "Ani Tsutsa"
        - "The Boys"
        - "Pleiades"
        - "Cherokee"
        - "Tsalagi"
        - "seven boys"
        - "ascension"
        - "transformation"
        - "star origin story"
        - "Mooney 1900"
      mythic_narrative: >
        Ani Tsutsa — The Boys — is the Cherokee name for the Pleiades.
        In the story documented by James Mooney (1900) and held in Cherokee
        oral tradition, seven young men spent their days dancing and
        neglecting their families. Their mothers, frustrated at their
        behaviour, gave them stones to eat instead of food. The boys,
        grieved and angry, danced harder — and as they danced faster, they
        began to rise from the earth. One mother caught her son and pulled
        him back, but the others rose into the sky and became the Pleiades.
        The boy who was pulled back sank into the earth and became a pine
        tree. In this way, the Cherokee see the pine as related to the
        Pleiades — sky and earth mirroring each other through the boys'
        divided fates. The six or seven visible stars correspond to the
        boys who fully ascended. The story carries moral weight: those who
        neglect earthly duties ascend, but the connection to earth is not
        entirely broken.
      visual_motifs:
        - "seven boys dancing upward"
        - "one sinking into earth as tree"
        - "six rising as stars"
        - "Pleiades cluster"
        - "Appalachian mountain setting"
    cultural_sensitivity:
      flag_level: "high"
      explanation: >
