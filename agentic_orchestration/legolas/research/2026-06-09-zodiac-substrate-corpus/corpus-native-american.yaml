  - sign_id: "native-american-pawnee-skidi-002"
    sign_name:
      primary: "Star-That-Does-Not-Walk-Around"
      variants:
        - "Skidi Pawnee North Star"
        - "Polaris / North Star (Pawnee)"
      romanization: "Star-That-Does-Not-Walk-Around"
      native_script: ""
    cultural_tradition:
      primary_culture: "Pawnee (Skidi Band)"
      derivative_cultures: []
      geographic_origin: "Nebraska, Great Plains"
      period_range: "Documented by Chamberlain (1982) and related academic sources"
      status_in_modern_tradition: "historical_documented"
    system_metadata:
      system_name: "Skidi Pawnee sky-tradition"
      total_signs_in_system: 0
      position_in_system: 2
      sign_classification:
        element: ""
        modality: ""
        quadrant: ""
        deity_association: >
          The North Star is identified as a chief or chief star in Skidi Pawnee
          tradition — the star that does not move, around which all others circle.
        season: >
          Polaris is circumpolar; visible year-round from North America.
        other:
          constellation_type: "fixed_star"
          stellar_identification: "Polaris (α Ursae Minoris)"
          seasonal_use: "Year-round orientation star; astronomical constant"
    visual_representation:
      image_url:
        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Polaris_alpha_ursae_minoris.jpg/1200px-Polaris_alpha_ursae_minoris.jpg"
        description: "Polaris (North Star / α Ursae Minoris)"
        source: "Wikipedia Commons"
        license: "CC-BY-SA"
        verified_loads: true
      image_url_secondary: []
      star_coordinates:
        coordinate_system: "IAU equatorial J2000"
        primary_stars:
          - name: "Polaris (α Ursae Minoris)"
            ra: "02h 31m 49s"
            dec: "+89° 15′ 51″"
            magnitude: 1.97
            notes: >
              The current north celestial pole star (within ~0.7°); appears
              nearly stationary in the sky while all other stars rotate around
              it. A natural choice for navigation and cosmic-axis symbolism
              across many Northern Hemisphere cultures.
        notes: >
          The Skidi Pawnee name "Star-That-Does-Not-Walk-Around" (per
          Chamberlain 1982) describes the most visible astronomical property
          of Polaris with precision: it does not appear to move. Other stars
          'walk around' it in their apparent daily rotation.
      asterism_schematic:
        description: "Single star (Polaris); the fixed centre of the apparent sky-rotation"
        line_topology: "Single star"
      cultural_iconography:
        description: >
          The Skidi Pawnee recognition of Polaris as the star that does not
          move — "Star-That-Does-Not-Walk-Around" — reflects the same
          astronomical observation made by many cultures across the Northern
          Hemisphere. The precision of the Skidi Pawnee name is notable:
          it describes the star's behaviour directly rather than using a
          mythological figure. In Skidi Pawnee cosmology where stars are
          living chiefs, the star at the axis of the sky's rotation has
          obvious high-status significance. Documented by Chamberlain (1982)
          and confirmed through the Skidi Pawnee Star Chart record.
        reference_sources:
          - "Chamberlain, V.D. (1982). When Stars Came Down to Earth. Ballena Press."
          - "Field Museum of Natural History, Pawnee Star Chart, Catalog #16979."
        reference_urls:
          - "https://en.wikipedia.org/wiki/Skidi_Pawnee"
    primitive_association_hints:
      suggested_element: "Cosmic / Air"
      suggested_attribute: "Constancy / axis / unwavering centre"
      suggested_animal_form: ""
      suggested_object_form: "The fixed star at the axis of heaven"
      symbolic_role: "Cosmic axis; fixed point; non-moving chief of stars"
      mythic_narrative_summary: >
        "Star-That-Does-Not-Walk-Around" is the Skidi Pawnee name for Polaris
        — precise, descriptive, non-mythological. As all other stars revolve
        around it, it is the fixed point of the sky. Documented by Chamberlain
        (1982).
    semantic_vocabulary:
      symbolic_keywords:
        - "Polaris"
        - "North Star"
        - "axis"
        - "Pawnee"
        - "Skidi Band"
        - "fixed star"
        - "does not walk"
        - "sky centre"
        - "circumpolar"
        - "navigation"
      mythic_narrative: >
        "The Star-That-Does-Not-Walk-Around" — the Skidi Pawnee name for
        Polaris — is one of the most descriptively precise astronomical names
        in the documented Native American record. While other stars trace
        apparent arcs through the night sky (they 'walk around'), Polaris
        stays nearly fixed at the north celestial pole. The name avoids
        mythological overlay; it describes the astronomical phenomenon
        directly. In Skidi Pawnee cosmology, where stars are living chiefs
        and the sky is a populated council of star-beings, the fixed chief
        at the centre of all sky-motion holds obvious primacy. Documented
        by Chamberlain (1982) and linked to the Field Museum Star Chart.
      visual_motifs:
        - "single star fixed at sky centre"
        - "star trails circling Polaris"
        - "north celestial pole"
        - "Great Plains horizon"
    cultural_sensitivity:
      flag_level: "high"
      explanation: >
        Per-tribe only (Pawnee — Skidi Band). Sourced from Chamberlain (1982)
