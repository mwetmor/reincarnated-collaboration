      mythic_narrative: >
        In the Anishinaabe (Ojibwe) tradition, the Big Dipper (Ursa Major)
        is the Fisher — a pine marten of great courage who ascended to the
        sky realm to free summer from the sky-cage where the sky-people had
        imprisoned it, leaving the earth in endless winter. The Fisher fought
        his way through the sky, opened the cage, and released birds and
        warm air back to the earth. Before he could escape, he was shot by
        arrows and fell — but he ascended as stars, becoming the Big Dipper.
        The wounded tail of the Fisher (the tip of the Dipper's handle, Alkaid)
        still bears the mark of the arrow. The story explains why winter comes
        and goes: the summer-cage is open but not fully free; the Fisher
        patrols the sky as stars, tipping up in summer (releasing warmth)
        and falling in winter (closing off the warmth). Basil Johnston's
        "Ojibway Heritage" (1976) is one of the key academic sources for
        Anishinaabe traditional knowledge.
