      suggested_element: "Earth / Water (Arctic)"
      suggested_attribute: "Migration / survival / hunter-prey relationship"
      suggested_animal_form: "Caribou (Rangifer tarandus)"
      suggested_object_form: ""
      symbolic_role: >
        Hunted animal; seasonal guide; survival knowledge embodied in sky;
        hunter-caribou relationship as cosmic frame
      mythic_narrative_summary: >
        Tukturjuit (Caribou) is the Eastern Arctic Inuit identification of
        Ursa Major as a caribou being pursued by hunters. Circumpolar and
        year-round visible; its rotating position tracks seasons and time
        of night. MacDonald (1998) is the authoritative academic source.
    semantic_vocabulary:
      symbolic_keywords:
        - "caribou"
        - "Ursa Major"
        - "Big Dipper"
        - "Inuit"
        - "Eastern Arctic"
        - "circumpolar"
        - "hunting"
        - "seasonal migration"
        - "Arctic survival"
        - "tukturjuit"
      mythic_narrative: >
        Tukturjuit — the Caribou — is one of the most recognised Inuit sky-
        figures, identifying the seven stars of the Big Dipper (Ursa Major)
        as a caribou. The constellation is circumpolar at Arctic latitudes,
        meaning it never sets below the horizon; it rotates through the Arctic
        sky as a great clock and calendar. Caribou are the central subsistence
        animal of many Eastern Arctic Inuit communities; their migrations are
        life-sustaining events, and the sky-caribou embodies the relationship
        between hunter and hunted at cosmic scale. MacDonald (1998) "The
        Arctic Sky" documents this and related Inuit sky-figures from elder
        consultation and historical ethnographic records held by the Royal
        Ontario Museum and Nunavut Research Institute.
      visual_motifs:
        - "caribou silhouette"
        - "Big Dipper asterism as body"
        - "circumpolar rotation"
        - "Arctic tundra below / star-field above"
    cultural_sensitivity:
      flag_level: "high"
      explanation: >
        Sourced from publicly-published academic ethnoastronomy: MacDonald
        (1998) "The Arctic Sky" (Royal Ontario Museum / Nunavut Research
