  - sign_id: "inuit-eastern-arctic-002"
    sign_name:
      primary: "Aagjuuk"
      variants:
        - "the Hunter Stars (Eastern Arctic Inuit)"
        - "Aquila pair (Inuit)"
      romanization: "Aagjuuk"
      native_script: "ᐋᒡᔪᒃ"
      # Inuktitut syllabics from MacDonald (1998) and public sources
    cultural_tradition:
      primary_culture: "Eastern Arctic Inuit (Nunavut / Baffin Island region)"
      derivative_cultures: []
      geographic_origin: "Eastern Canadian Arctic"
      period_range: "Living tradition; documented in MacDonald (1998) from elder consultation"
      status_in_modern_tradition: "active_living"
    system_metadata:
      system_name: "Eastern Arctic Inuit sky-tradition"
      total_signs_in_system: 0
      position_in_system: 2
      sign_classification:
        element: ""
        modality: ""
        quadrant: ""
        deity_association: ""
        season: >
          Critical summer marker: Aagjuuk (α and γ Aquilae — Altair and
          Tarazed) marks the shortest night near summer solstice in Eastern
          Arctic Inuit tradition. Its annual heliacal rising (first appearance
          before dawn) after a period of invisibility signals the return of
          Arctic darkness and approaching autumn — vital information in
          a land of midnight sun.
        other:
          constellation_type: "bright_star_pair"
          stellar_identification: "α Aquilae (Altair) and γ Aquilae (Tarazed)"
          seasonal_use: >
            Marks the summer solstice period / shortest night; signals return
            of meaningful darkness; critical calendar star for Arctic communities
            where summer brings weeks of continuous daylight.
    visual_representation:
      image_url:
        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Aquila_constellation_map.svg/1200px-Aquila_constellation_map.svg.png"
        description: >
          IAU star map of Aquila constellation; Aagjuuk = α Aquilae (Altair)
          and γ Aquilae (Tarazed), the two stars identified in Eastern Arctic
          Inuit tradition.
        source: "Wikipedia Commons"
        license: "CC-BY-SA"
        verified_loads: true
      image_url_secondary: []
      star_coordinates:
        coordinate_system: "IAU equatorial J2000"
        primary_stars:
          - name: "Altair (α Aquilae)"
            ra: "19h 50m 47s"
            dec: "+08° 52′ 06″"
            magnitude: 0.77
            notes: >
              12th brightest star in the sky; visible from Arctic latitudes
              (rises low on the horizon); one of the two Aagjuuk stars per
              MacDonald (1998)
          - name: "Tarazed (γ Aquilae)"
            ra: "19h 46m 15s"
            dec: "+10° 36′ 48″"
            magnitude: 2.72
            notes: >
              Second star of the Aagjuuk pair; close to Altair on the sky;
              together they mark the shortest night
        notes: >
          MacDonald (1998) specifically documents Aagjuuk as these two stars
          and their role as a summer solstice marker. The pair rises low above
          the southern horizon at Arctic latitudes; their brief appearance in
          the twilight of the Arctic summer signals the beginning of the return
          of night. This is a critically practical piece of astronomical
          knowledge for communities where the midnight sun can last for weeks.
      asterism_schematic:
        description: >
          Two-star pair: Altair (α Aquilae) and Tarazed (γ Aquilae), both in
          the Aquila region, separated by ~2.6 degrees on the sky. The pair
          marks a specific calendrical event (shortest night) rather than
          depicting a figure or creature.
        line_topology: "Two-star pair; line between α and γ Aquilae"
      cultural_iconography:
        description: >
          Aagjuuk serves a critically practical function in the Eastern Arctic
          Inuit astronomical calendar: it marks the end of the period when
          the Arctic night is so short as to be negligible. Its re-appearance
          after the midnight-sun period signals the approach of autumn —
          the season of hunting, seal-harvesting, and preparation for winter.
          MacDonald (1998) documents Aagjuuk as one of the most practically
          important sky-markers in the Eastern Arctic Inuit astronomical
          tradition.
        reference_sources:
          - "MacDonald, J. (1998). The Arctic Sky. Royal Ontario Museum /
             Nunavut Research Institute."
          - "Wikipedia: Aagjuuk"
        reference_urls:
          - "https://en.wikipedia.org/wiki/Aagjuuk"
    primitive_association_hints:
      suggested_element: "Air / Light"
      suggested_attribute: "Precision / calendrical precision / seasonal pivot"
      suggested_animal_form: ""
      suggested_object_form: "Two-star calendar marker"
      symbolic_role: >
        Summer solstice / shortest-night marker; herald of returning darkness;
        Arctic calendar pivot-point
      mythic_narrative_summary: >
        Aagjuuk (α and γ Aquilae) marks the shortest night near the summer
        solstice in Eastern Arctic Inuit tradition. Its brief appearance in
        the twilight signals the return of meaningful night — a critical
        calendar marker for Arctic communities. Documented by MacDonald (1998).
    semantic_vocabulary:
      symbolic_keywords:
        - "Aagjuuk"
        - "Altair"
        - "Aquila"
        - "summer solstice"
        - "shortest night"
        - "Arctic calendar"
        - "midnight sun"
        - "returning darkness"
        - "two stars"
        - "Eastern Arctic Inuit"
      mythic_narrative: >
        Aagjuuk — the two stars Altair (α Aquilae) and Tarazed (γ Aquilae) —
        is one of the most practically significant sky-figures in Eastern Arctic
        Inuit astronomy. At Arctic latitudes, the summer sun barely sets for
        weeks; the brief reappearance of Aagjuuk low on the southern horizon
        at midnight marks the exact turning point — the shortest night, after
        which meaningful darkness gradually returns. This signals the beginning
        of the autumn hunting and preparation season. MacDonald (1998) "The
        Arctic Sky" identifies Aagjuuk as among the most precisely observed
        Inuit sky-figures, a testament to the practical astronomical precision
        maintained by Arctic communities through generations of careful sky-
        watching.
      visual_motifs:
        - "two bright stars low on horizon"
        - "twilight Arctic sky"
        - "midnight sun giving way to first true darkness"
        - "hunting season beginning"
    cultural_sensitivity:
      flag_level: "high"
      explanation: >
        Sourced from MacDonald (1998) "The Arctic Sky" — the authoritative
