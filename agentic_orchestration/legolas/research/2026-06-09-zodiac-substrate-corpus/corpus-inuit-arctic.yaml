entries:

  - sign_id: "inuit-eastern-arctic-001"
    sign_name:
      primary: "Tukturjuit"
      variants:
        - "The Caribou (Inuit)"
        - "Ursa Major Caribou"
      romanization: "Tukturjuit"
      native_script: "ᑐᒃᑐᕐᔪᐃᑦ"
      # Inuktitut syllabics; from MacDonald (1998) and public Inuktitut sources
    cultural_tradition:
      primary_culture: "Eastern Arctic Inuit (Nunavut / Baffin Island region)"
      derivative_cultures:
        - "This sky-reading is documented for Eastern Arctic Inuit traditions;
           other Inuit regional traditions may have related or variant readings
           of Ursa Major. Each regional tradition is distinct."
      geographic_origin: "Eastern Canadian Arctic — Baffin Island, Nunavut, and surrounding regions"
      period_range: >
        Living tradition; documented in ethnographic record from Rasmussen's
        Thule Expeditions (1920s); academic study by MacDonald (1998) from
        elder consultation. Continuous pre-contact practice.
      status_in_modern_tradition: "active_living"
    system_metadata:
      system_name: "Eastern Arctic Inuit sky-tradition"
      total_signs_in_system: 0
      position_in_system: 1
      sign_classification:
        element: ""
        modality: ""
        quadrant: ""
        deity_association: ""
        season: >
          Ursa Major is circumpolar from Arctic latitudes — visible year-round.
          Tukturjuit's orientation and position track the seasons. Spring
          and autumn migrations of caribou correspond to the constellation's
          position in the night sky.
        other:
          constellation_type: "bright_star_asterism"
          stellar_identification: "Ursa Major (the Big Dipper / Plough)"
          seasonal_use: >
            The rotating position of Tukturjuit (Ursa Major) through the Arctic
            night sky tracks seasonal passage. Caribou hunting seasons
            historically correlated with the constellation's observed position.
    visual_representation:
      image_url:
        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Ursa_Major_constellation_map.svg/1200px-Ursa_Major_constellation_map.svg.png"
        description: >
          IAU star map of Ursa Major — the constellation identified as
          Tukturjuit (Caribou) in Eastern Arctic Inuit tradition.
        source: "Wikipedia Commons (IAU constellation map)"
        license: "CC-BY-SA"
        verified_loads: true
      image_url_secondary: []
      star_coordinates:
        coordinate_system: "IAU equatorial J2000"
        primary_stars:
          - name: "Dubhe (α Ursae Majoris)"
            ra: "11h 03m 44s"
            dec: "+61° 45′ 03″"
            magnitude: 1.79
            notes: "Part of Ursa Major; circumpolar from Arctic latitudes"
          - name: "Merak (β Ursae Majoris)"
            ra: "11h 01m 50s"
            dec: "+56° 22′ 56″"
            magnitude: 2.37
            notes: "Part of Big Dipper / Plough asterism"
          - name: "Alioth (ε Ursae Majoris)"
            ra: "12h 54m 02s"
            dec: "+55° 57′ 35″"
            magnitude: 1.77
            notes: "Brightest star in Ursa Major"
          - name: "Alkaid (η Ursae Majoris)"
            ra: "13h 47m 32s"
            dec: "+49° 18′ 48″"
            magnitude: 1.86
            notes: "Tail end of Big Dipper handle"
        notes: >
          Ursa Major is circumpolar at Arctic latitudes (60°N+), rotating
          around Polaris throughout the year. This makes Tukturjuit a
          year-round sky-presence for Eastern Arctic Inuit communities,
          though its position changes hour-by-hour and season-by-season.
      asterism_schematic:
        description: >
          The seven principal stars of the Big Dipper / Plough form the body
          and legs of the caribou. Dubhe and Merak form the 'bowl' (body);
          the handle (Alioth, Mizar, Alkaid) forms the neck and head or legs,
          depending on source description. The broader Ursa Major constellation
          (88 IAU) extends further for the full body outline.
        line_topology: >
          Seven-star Big Dipper asterism; caribou body mapped to the Dipper
          bowl and handle. Exact limb-assignment varies by sub-regional
          tradition within Inuit.
      cultural_iconography:
        description: >
          The identification of Ursa Major with a large animal being hunted
          is one of the most geographically widespread in human ethnoastronomy —
          appearing independently in multiple Arctic cultures (Inuit, Sámi)
          and in some Native American traditions. For Eastern Arctic Inuit,
          Tukturjuit (caribou) being hunted is a sky-narrative that mirrors
          terrestrial hunting life. The circumpolar nature of the constellation
          means it is always present, rotating through the Arctic sky; its
          orientation signals the time of night and season of year.
          MacDonald (1998) "The Arctic Sky" is the authoritative English-
          language academic source, based on interviews with Inuit elders and
          analysis of historical ethnographic records.
        reference_sources:
          - "MacDonald, J. (1998). The Arctic Sky: Inuit Astronomy, Star Lore,
             and Legend. Royal Ontario Museum / Nunavut Research Institute."
          - "Laugrand, F. & Oosterens, J. (2010). Inuit Shamanism and
             Christianity. McGill-Queen's University Press."
          - "Wikipedia: Tukturjuit"
        reference_urls:
          - "https://en.wikipedia.org/wiki/Tukturjuit"
