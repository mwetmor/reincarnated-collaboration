    mythic_narrative: "Vishakha is the sixteenth Nakshatra, spanning the Libra-Scorpio border and identified with the main stars of Libra. The name means 'two-branched' or 'forked' — like a tree whose path splits, requiring a choice of direction toward a distant goal.\n\nThe presiding deity is Indragni — the unique combined form of Indra (king of the gods, wielder of lightning, destroyer of Vritra) and Agni (the sacred fire of sacrifice and transformation). Together they represent the fusion of royal power and sacred fire, worldly kingship and spiritual authority. Their joint worship was common in early Vedic rituals associated with victory and triumph.\n\nThe symbol — the triumphal arch or gateway — represents the moment of achieved victory after long striving. The potter's wheel symbol adds another dimension: like the potter who continuously works the wheel to shape clay, Vishakha represents sustained, focused effort over time. Jupiter's rulership adds wisdom, philosophy, and the sense that the goal being pursued is a righteous and worthy one. In Jyotish, Vishakha natives are said to be intensely goal-focused, ambitious, determined, sometimes jealous of competitors, and ultimately capable of great achievement through disciplined effort. The gana Rakshasa (fierce) speaks to the ferocity of the archer's focus on the distant target."
