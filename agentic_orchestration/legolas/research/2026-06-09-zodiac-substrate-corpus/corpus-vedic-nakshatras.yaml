    mythic_narrative: "Jyeshtha is the eighteenth Nakshatra, completing the arc of sidereal Scorpio and anchored on the blazing red supergiant Antares — the Heart of the Scorpion and one of the four Royal Stars of ancient Persia. Antares means 'rival of Ares (Mars)' in Greek, named for its similar vivid red-orange color. The name Jyeshtha means 'the eldest,' 'the greatest,' or 'the chief.'\n\nThe presiding deity is Indra — king of the gods, lord of Svarga (heaven), wielder of the vajra (thunderbolt), and the greatest warrior in Vedic cosmology. Indra slew the cosmic serpent Vritra who had stolen all the world's waters, releasing the rains and making agriculture possible. Despite his power, Indra's mythology is full of falls from grace — he is proud, sensual, sometimes cowardly, and repeatedly humbled by sages and demons before recovering his greatness. Jyeshtha carries this full weight of power-with-vulnerability.\n\nThe symbol, the circular amulet or talisman, is the protective charm that the eldest wears — the mark of protective authority, the burden of being the one others look to for defense. Jyeshtha represents the difficulty and weight of seniority: the eldest who must protect, the chief who cannot show weakness, the king whose subjects' lives depend on his strength. Mercury's rulership adds intellectual sharpness and the psychological complexity of maintaining this difficult position. Quality is Tikshna (sharp/dreadful) — the most intense quality, matching Antares's blazing intensity."
