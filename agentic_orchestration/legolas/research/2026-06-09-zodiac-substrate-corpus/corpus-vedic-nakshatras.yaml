    mythic_narrative: "Ashvini is the first of the 27 Nakshatras, occupying the early degrees of sidereal Aries. Its presiding deities are the Ashvini Kumaras (Ashvins) — the divine twin horse-headed physicians of the Vedic pantheon. According to myth, Saranyu (daughter of Vishvakarma) fled from Surya (Sun god) in the form of a mare; Surya followed in horse form, and their union produced the Ashvins.\n\nThe Ashvins are associated with dawn, healing, rejuvenation, and speed. They drive a golden chariot across the sky before sunrise, arriving before the day begins — they are the physicians of the gods, said to have restored sight to the sage Chyavana and saved the hero Bhujyu from the ocean. Their dual nature (twins) makes them associated with partnerships, balance, and complementary forces.\n\nIn Jyotish, Ashvini natives are said to be quick, energetic, skilled healers, or those with swift intelligence. The Nakshatra's gana is Deva (divine), suggesting spiritual purity and light-natured qualities. Ruling planet is Ketu, associated with mysticism and past-life wisdom."
