    mythic_narrative: "Revati is the twenty-seventh and final Nakshatra, completing the full arc of the 27-mansion zodiac in the last degrees of sidereal Pisces. Its anchor star, ζ Piscium, is literally named 'Revati' and historically marks the traditional zero point of the sidereal zodiac — the exact boundary where the cycle of 27 Nakshatras ends and begins again with Ashvini. Revati is the end that is a beginning.\n\nThe presiding deity is Pushan — one of the most ancient Vedic solar gods, the tender of herds, the guide of travelers, the protector of pathways, and the deity who safely guides souls between worlds. Pushan knows every road, every path, every transition. He carries a goad to guide cattle, and his chariot is drawn by goats (not horses). In the Mahabharata and Puranas, Pushan guides the soul of the deceased safely through the underworld to its next destination. As the final Nakshatra, Revati naturally receives Pushan's guidance for the soul's completion.\n\nThe mythological story of Revati herself is one of the earliest discussions of time dilation in Indian literature: Princess Revati's father took her to Brahmaloka (the realm of Brahma) to seek a suitable husband. In Brahma's realm, one day equals millions of Earth years. When they returned, they found that the entire age had changed — the world they knew was gone, and Revati eventually married Balarama (Krishna's elder brother). This myth of cosmic time collapse and return mirrors the Nakshatra's position: the end of the zodiac represents the return from the cosmic realm to begin again.\n\nQuality is Mridu (soft/gentle) — the final nakshatra closes the cycle with compassion and grace. Mercury's rulership adds the communicative intelligence of the final messenger and guide."
