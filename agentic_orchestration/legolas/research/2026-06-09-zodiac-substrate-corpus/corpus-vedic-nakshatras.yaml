    mythic_narrative: "Rohini is the fourth Nakshatra and one of the most auspicious in Jyotish, spanning the heart of sidereal Taurus anchored by the brilliant red star Aldebaran (α Tauri). The name Rohini means 'the red one,' directly referencing Aldebaran's vivid orange-red hue — one of the brightest stars in the night sky.\n\nRohini is personified as the most beautiful of Chandra's (Moon god's) 27 wives — each wife representing one Nakshatra and the Moon spending one night per month at each mansion. Chandra was said to favor Rohini above all others, neglecting his other 26 wives. Their complaints to their father Daksha resulted in a curse of waxing and waning, explaining the Moon's phases in Vedic cosmology.\n\nThe presiding deity is Prajapati/Brahma — the creator — reinforcing Rohini's themes of fertility, creativity, and material abundance. The symbol is the ox cart or chariot, representing slow, stable, powerful movement through the world and agricultural abundance. Lord Krishna was said to be born under Rohini Nakshatra, adding immense spiritual significance. Ruling planet is the Moon (Chandra). Quality is Sthira (fixed) — the most stable and enduring of nakshatra qualities."
