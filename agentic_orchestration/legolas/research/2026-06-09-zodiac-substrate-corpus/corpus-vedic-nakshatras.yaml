    mythic_narrative: "Ardra is the sixth Nakshatra, anchored on the single brilliant red supergiant Betelgeuse (α Orionis) at the shoulder of Orion. The name means 'the moist one' or 'fresh' — like a dewdrop after a cleansing storm, or a teardrop shed in cathartic grief.\n\nThe presiding deity is Rudra — the howling storm god, the fierce hunter, the wild lord of the forest. Rudra is the proto-form of Shiva, representing the destructive aspect of the divine: the storm that destroys in order to purify and renew. His laughter shakes the cosmos; his arrows bring disease and death; yet he is also the healer who holds the antidote. Ardra's symbol, the teardrop, represents both the storm's rain and the grief that follows destruction.\n\nBetelgeuse is one of the most dramatic stars in the sky — a red supergiant 700 times the diameter of the Sun, visibly variable in brightness, and destined to explode as a supernova in the astronomical future. Its vivid red color, great size, and instability perfectly embody Rudra's intense, transformative energy. In Jyotish, Ardra natives are said to be sharp-minded, emotionally intense, capable of breakthroughs achieved through suffering and struggle. The quality is Tikshna (sharp/dreadful) — the most intense of nakshatra qualities. Ruled by Rahu (north node), adding a destabilizing, obsessive, boundary-crossing dimension."
