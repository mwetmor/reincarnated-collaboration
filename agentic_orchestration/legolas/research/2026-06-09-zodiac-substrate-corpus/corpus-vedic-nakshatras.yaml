    mythic_narrative: "Swati is the fifteenth Nakshatra, in the middle of sidereal Libra and anchored on the brilliant orange star Arcturus — the brightest star in the northern celestial hemisphere. The name means 'the sword,' 'self-going,' or 'independent star' — Swati is characterized above all by independence, freedom, and the wind's uncontainable movement.\n\nThe presiding deity is Vayu — the wind god and father of Hanuman and Bhima. Vayu is the life-breath (prana) itself, the invisible animating force behind all living things. He moves freely, unbounded, penetrating everywhere. His children inherit his independence: Hanuman leaps across oceans; Bhima's strength is unstoppable. Vayu's symbol — the young plant shoot bending in the wind — captures the essence of Swati: flexible enough to bend without breaking, rooted enough to survive the storm.\n\nArcturusis remarkable among bright stars for its very high proper motion — it is literally moving independently through the galaxy at high speed, a visitor from an ancient stellar stream. This astronomical fact mirrors Swati's astrological meaning: independent movement, self-directed, not bound by convention. In Jyotish, Swati natives are said to be independent, business-minded (Libra), adaptable, skilled in trade, and inclined toward freedom and self-determination. Rahu's rulership adds restlessness, ambition, and boundary-crossing."
