    mythic_narrative: "Krittika is the third Nakshatra, straddling the sidereal Aries-Taurus border and centered on the Pleiades star cluster. It was once the first Nakshatra when Earth's axial precession placed the Pleiades at the vernal equinox around 2300 BCE, making it the oldest known sky reference point in Vedic astronomy.\n\nThe presiding deity is Agni, the fire god — the sacred flame of creation, sacrifice, and transformation. The six Krittikas are celestial mothers who nursed Kartikeya (Skanda/Murugan), the six-headed god of war and divine commander of the celestial army. According to myth, Shiva's seed was cast into fire (Agni) and then delivered by the Krittikas. Their six faces represent the six stars of the Pleiades visible to the naked eye.\n\nThe symbol is the razor or flame — Krittika cuts away impurity. In Jyotish, Krittika natives are said to be sharp, penetrating, critical, and transformative. They can nurture fiercely (like the six mothers) but also cut away what is unnecessary. Gana is Rakshasa (fierce), reflecting the transformative-destructive quality of fire. Ruling planet is the Sun (Surya), source of all fire and light."
