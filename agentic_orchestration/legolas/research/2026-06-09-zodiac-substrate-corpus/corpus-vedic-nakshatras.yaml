    mythic_narrative: "Anuradha is the seventeenth Nakshatra, in the middle of sidereal Scorpio and identified with three stars in the crown/forehead of the Scorpion — β, δ, and π Scorpii. The name means 'following Radha' or 'the star that follows the Vishakha' (the previous nakshatra was also called Radha in older naming conventions).\n\nThe presiding deity is Mitra — one of the most ancient of the Adityas, who governs friendship, alliances, daylight, and sacred covenants. In early Vedic texts, Mitra and Varuna are inseparable: Varuna oversees cosmic order through law and justice, while Mitra upholds it through friendship, loyalty, and the bonds of affection. Mitra is the warm face of dharmic order — the one who holds relationships together through devotion rather than enforcement.\n\nThe symbol, the lotus flower, represents the capacity for spiritual friendship to blossom even in difficult circumstances — the lotus grows in muddy water but blooms with pristine beauty above the surface. Anuradha sits in the heart of Scorpio, a sign often associated with intensity and transformation, yet Anuradha's energy is one of tender devotion and diplomatic grace. Saturn's rulership adds discipline, endurance, and the long patience required of true friendship. Quality is Mridu (soft/mild) — gentleness in the scorpion's heart."
