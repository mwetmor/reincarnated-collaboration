    mythic_narrative: "Bharani is the second Nakshatra, occupying the middle degrees of sidereal Aries. Its name means 'the bearer' — one who carries or sustains a burden. The presiding deity is Yama, the god of death, dharma, and the underworld, who governs the fate of souls after death.\n\nThe symbol is the yoni — the feminine vessel or womb — which creates a striking paradox: Yama (death) presides over a symbol of birth. This paradox is central to Bharani's meaning: it governs the passage between states of existence, the threshold of creation and dissolution. Life and death are twin faces of the same process.\n\nIn Jyotish, Bharani natives are said to be determined, enduring, creative, and capable of bearing great responsibility. They can also be controlling or intense, reflecting Yama's uncompromising nature. Venus as ruling planet adds sensuality and aesthetic appreciation. The gana is Manushya (human), suggesting worldly engagement and karmic complexity. Ruling planet: Venus (Shukra)."
