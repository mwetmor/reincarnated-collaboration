    mythic_narrative: "Uttara Phalguni is the twelfth Nakshatra, spanning the Leo-Virgo border and anchored on Denebola — the bright star at the lion's tail. Its name means 'latter reddish one,' the second of the paired Phalguni Nakshatras.\n\nWhere Purva Phalguni represents the enjoyment of rest and pleasure, Uttara Phalguni represents the responsibilities and social bonds that make such enjoyment possible and sustainable. The presiding deity is Aryaman, one of the twelve Adityas, who governs nobility, aristocratic duty, social contracts, the honor of one's word, and proper conduct in relationships. Aryaman also presides over the Milky Way — the bright path of ancestors — linking social duty with ancestral honor.\n\nThe symbol, the back legs of the bed, represents the stable foundation: where Purva Phalguni is the pleasure of the encounter, Uttara Phalguni is the lasting commitment, the marriage vow, the promise that remains when pleasure fades. The Sun (Surya) rules this nakshatra, adding clarity, authority, and the burning steadiness of dharmic purpose. Quality is Sthira (fixed/stable) — the most enduring nakshatra quality, appropriate for the deity of contracts and honor."
