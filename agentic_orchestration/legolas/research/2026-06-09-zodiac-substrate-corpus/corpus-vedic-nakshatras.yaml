    mythic_narrative: "Chitra is the fourteenth Nakshatra, spanning the Virgo-Libra border and anchored on the single brilliant star Spica — one of the brightest in the sky, a blue-white binary nearly 2,000 times more luminous than the Sun. Spica's solitary brilliance against the background sky is itself the perfect expression of Chitra: 'the bright jewel,' 'the shining one,' 'the beautiful picture.'\n\nThe presiding deity is Vishvakarma (also called Tvastar) — the divine architect and craftsman of the gods. He fashioned the celestial city Lanka for Ravana, built Indra's paradise Amaravati, created the discus (Sudarshana Chakra) of Vishnu, and crafted the trident of Shiva. He is the master artisan of the cosmos, the one who makes divine visions concrete through skillful making.\n\nChitra thus represents the nakshatra of artistic and architectural brilliance — the capacity to manifest beautiful, complex structures from inspired vision. Natives in Jyotish are said to be visually gifted, fashion-conscious, skilled in creative arts, capable of building beautiful things. Mars as ruling planet adds the drive and technical precision required to actualize creative vision. The quality is Mridu (soft/beautiful) despite the Rakshasa gana — suggesting that Chitra's fierce quality is channeled into aesthetic intensity rather than aggression."
