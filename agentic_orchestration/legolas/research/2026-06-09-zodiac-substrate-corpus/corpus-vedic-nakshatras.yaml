    mythic_narrative: "Mrigashira is the fifth Nakshatra, spanning the late degrees of sidereal Taurus into early Gemini, centered on the head of Orion (λ Orionis, Meissa). The name means 'deer's head' — mriga also carries the meaning of 'search' or 'seeking,' making this a nakshatra of questing and exploration.\n\nThe presiding deity is Soma (Chandra, the Moon), the god of the sacred nectar amrita and the plant world. Soma is gentle, luminous, and nourishing. In one Vedic myth, Prajapati (the creator) pursued his daughter Rohini in deer form to the sky; she became the star Aldebaran (Rohini nakshatra), and the hunter Orion represents the cosmic pursuit. Mrigashira represents the deer — the sought, the beautiful, the elusive.\n\nThe quality is Mridu (soft/tender), the most gentle of the nakshatra qualities. Natives are said to be curious, wandering, gentle, charming, and perpetually searching for beauty or truth. The dual-rashi span (Taurus–Gemini) gives it both earthy groundedness and airy intellectual restlessness. Ruling planet is Mars (Mangala), which may seem paradoxical for a gentle deer nakshatra — Mars here channels into pursuit, drive, and the hunter energy rather than aggression."
