    mythic_narrative: "Shravana is the twenty-second Nakshatra, in the heart of sidereal Capricorn and anchored on the brilliant star Altair — the Eagle, vertex of the Summer Triangle and one of the nearest bright stars to Earth (17 light-years). The name means 'to hear' — Shravana is the nakshatra of the listener, the student, and the one who receives divine knowledge through the sacred act of hearing.\n\nThe presiding deity is Vishnu — the cosmic preserver, the sustainer of universal order, who takes ten avatars (Dashavatara) whenever dharma declines. Vishnu's most famous mythological act associated with Shravana is the story of Trivikrama: as the dwarf avatar Vamana, Vishnu asked the generous demon-king Mahabali for three paces of land. When granted, Vishnu revealed his cosmic form and in three strides measured the entire universe — one step for earth, one for heaven, one for the underworld. The three footprints symbol commemorates these three cosmic strides.\n\nThe three-star line of Altair and its flanking stars mirrors the three footprints perfectly. In Jyotish, Shravana natives are said to be good listeners, devoted students, skilled at gathering knowledge, spiritually receptive, and inclined toward teaching what they have heard. The Moon as ruling planet adds receptivity, memory, and the reflective quality of the good student. Onam, Kerala's greatest festival celebrating Mahabali's return, falls in the Shravana month."
