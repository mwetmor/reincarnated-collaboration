    mythic_narrative: "Mula is the nineteenth Nakshatra, opening the arc of sidereal Sagittarius and traced across the sweeping nine-star tail of Scorpius — the most dramatic asterism in the southern sky. The name means 'the root' — the most fundamental origin, the thing at the very base.\n\nThe presiding deity is Nirrti — the goddess of dissolution, misfortune, and the underworld, who governs the realm of decay and endings. Where other deities sustain or create, Nirrti dissolves — she is the force that breaks down what is worn out, clearing space for what comes next. Her name means 'without rta' — without cosmic order — yet her function is essential to the cycle. Like the microbes that decompose fallen leaves to nourish the soil, Nirrti serves the larger order through dissolution.\n\nMula's position in the sky is cosmologically extraordinary: this nakshatra points directly toward the Galactic Center — the supermassive black hole Sagittarius A* at the heart of the Milky Way, the literal root and gravitational center of the entire galaxy. In Vedic cosmology, Mula is associated with the root chakra and the beginning of the cycle of rebirth. Ketu's rulership connects Mula to past-life karma, spiritual liberation, and the point of total surrender. The quality Tikshna (dreadful/sharp) and the gana Rakshasa (fierce) make Mula the most intense of nakshatras, but its ultimate teaching is: find the root, and transformation becomes possible."
