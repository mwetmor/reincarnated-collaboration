# KEY DISTINCTION — SIDEREAL vs TROPICAL ZODIAC:
# Vedic Jyotish uses the SIDEREAL zodiac (Nirayana system — fixed to star positions).
# Western tropical zodiac is fixed to equinoxes (moves with precession).
# Due to the precession of equinoxes (ayanamsa), sidereal Aries currently begins ~April 14
# (vs Western Aries March 21). The offset (Lahiri ayanamsa) is ~23°15' as of 2026.
# This means a Western "Aries" person (born March 21 – April 13) is Jyotish "Meena" (Pisces).
#
# KALAPURUSHA: The cosmic person — the zodiac as the body of the Universe-Person.
# Each Rashi governs a body region of Kalapurusha.

