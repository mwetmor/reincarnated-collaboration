  mythic_narrative: >
    The Bull of Heaven (MUL.GUD.AN.NA) appears prominently in the Epic of Gilgamesh (Tablet VI).
    When Gilgamesh spurns Ishtar's advances, she demands Anu release the Bull upon Uruk as punishment.
    The Bull snorts three times, opening pits that swallow hundreds of warriors. Enkidu grabs it by
    the horns while Gilgamesh drives a sword between the horns and neck. Enkidu then tears off the
    Bull's thigh and flings it in Ishtar's face in defiance. This hubris — killing the Bull of Heaven —
    leads directly to the gods' decree that Enkidu must die, setting in motion Gilgamesh's quest for
    immortality. The Pleiades (Seven Sisters) also reside in this constellation, forming a distinct
    sacred asterism recognized across world cultures.
