    cultural_sensitivity:
      flag_level: "high"
      griaule_controversy_flag: |
        MANDATORY GRIAULE CONTROVERSY FLAG:
        Marcel Griaule's fieldwork (1930s–1950s) claimed the Dogon people
        had detailed pre-telescopic knowledge of Sirius B (a white dwarf
        companion to Sirius, invisible to the naked eye). This claim was
        widely publicised and became a popular-press sensation.

        Academic status: CONTESTED.
        Van Beek, W.E.A. (1991). "Dogon Restudied: A Field Evaluation of
        the Work of Marcel Griaule." Current Anthropology, 32(2), 139–167.
        Van Beek returned to the same Dogon communities and found that
        Dogon people he interviewed did NOT possess the astronomical knowledge
        Griaule had reported. Van Beek concluded that Griaule's methodology
        and documentation were unreliable; the Sirius B knowledge was likely
        post-hoc contamination from Western visitors who had discussed Sirius
        with Dogon community members before or during Griaule's fieldwork.
        James Clifford's (1983) anthropological critique further questioned
        Griaule's methodology.

        Current academic consensus: the specific Sirius B claims attributed
        to the Dogon by Griaule should be treated as academically unreliable
        without independent corroboration. The undisputed fact is that Sirius
        (Sigi tolo) is religiously significant to the Dogon.
      explanation: >
        Dogon sky-lore sourced from peer-reviewed academic sources with
        explicit Griaule controversy flag. Marcel Griaule's 1930s–1950s
        fieldwork has been contested by subsequent anthropologists, notably
        van Beek (1991) "Dogon Restudied." Claims about Dogon pre-telescopic
        knowledge of Sirius B are academically disputed; this entry documents
        the public record with controversy flagged. Griaule-sourced claims
        are marked as "per Griaule (contested)."
      source_authorization: >
        Van Beek (1991) Current Anthropology; Clifford (1983); Wikipedia
        academic-cited ethnoastronomy
