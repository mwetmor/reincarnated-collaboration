      mythic_narrative: >
        The Sigui ceremony is held by the Dogon of the Bandiagara Escarpment
        approximately every 60 years — a generational event that involves
        masked dances, the renewal of ancestral objects, and the transmission
        of Dogon cultural knowledge across generations. It proceeds from
        village to village over several years. The most recent Sigui was held
        in 1966–73 and was documented on film by ethnographer Jean Rouch;
        the next would occur approximately 2026–2033. Griaule associated the
        60-year interval with Jupiter's cycle and with Sirius B's orbital
        period (~50 years); van Beek's restudy questioned whether this
        astronomical linkage reflected authentic Dogon astronomy or Griaule's
        interpretive framework. The Sigui's cultural reality and importance
        are not in question; its astronomical derivation is the contested
        territory.
