          specific within a year. The 60-year interval is the astronomical
          period in question. Possible astronomical bases: Jupiter's ~12-year
          orbital period × 5 = 60 years; or Saturn's ~29.5-year × 2 = 59 years.
          The exact astronomical basis is academically discussed but not
          definitively established.
