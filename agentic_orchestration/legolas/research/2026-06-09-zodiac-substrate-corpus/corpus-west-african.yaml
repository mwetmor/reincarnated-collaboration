            star of Sirius 'Po tolo' and described it as 'the heaviest star'
            and 'the smallest star.' Griaule mapped this to Sirius B. This
            entry documents what Griaule reported, NOT as fact.
    visual_representation:
      image_url:
        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Sirius_A_and_B_artwork.jpg/1200px-Sirius_A_and_B_artwork.jpg"
        description: >
          Artist's impression of Sirius A and B — Po tolo is claimed
          (per Griaule, contested) to be the Dogon name for Sirius B,
          the white dwarf companion visible only through telescope.
        source: "NASA/ESA via Wikipedia Commons"
        license: "Public domain (NASA)"
        verified_loads: true
      image_url_secondary: []
      star_coordinates:
        coordinate_system: "IAU equatorial J2000"
        primary_stars:
          - name: "Sirius B (white dwarf companion)"
            ra: "06h 45m 08s"
            dec: "−16° 42′ 58″"
            magnitude: 8.44
            notes: >
              Sirius B is at the same position as Sirius A on the sky
              (binary system) but invisible to the naked eye (magnitude 8.44
              vs Sirius A at −1.46). This is precisely why Griaule's claim
              was sensational — and why it was subsequently contested.
              A naked-eye observer cannot distinguish Sirius B from Sirius A.
        notes: >
          The key scientific fact underpinning the Griaule controversy:
          Sirius B was discovered telescopically in 1862 (Clark). It cannot
          be observed with the naked eye. If the Dogon had detailed knowledge
          of Sirius B as Griaule claimed, this would require either (a) an
          unknown pre-telescopic discovery method, or (b) post-contact
          knowledge transmission. Van Beek (1991) argues for explanation (b)
          or simple fieldwork error as the most parsimonious account.
      asterism_schematic:
        description: >
          Per Griaule (contested): Po tolo is the companion star of Sirius —
          invisible to naked eye. The 'asterism' is the putative two-star
          mental model (Sirius A = Sigi tolo; Sirius B = Po tolo).
          This mental model's pre-contact authenticity is what is disputed.
        line_topology: "Two-body stellar pair (one invisible to naked eye)"
      cultural_iconography:
        description: >
          PER GRIAULE (CONTESTED):
          Griaule documented that the Dogon described Po tolo as: (1) the
          heaviest of all stars; (2) the smallest of all stars; (3) a companion
          to Sigi tolo (Sirius A); (4) associated with the po seed (millet) —
          the smallest Dogon grain, symbolising density and concentration.
          Griaule and Dieterlen published this in "A Sudanese Sirius System"
          (1950) and developed it further in "Le Renard pâle" (1965).

          VAN BEEK RESTUDY (1991):
          Van Beek found that Dogon people did not describe Sirius as having
          a companion star; the knowledge of Po tolo as a white-dwarf companion
          was not reproduced in his fieldwork. Van Beek concluded the knowledge
          was likely introduced to Dogon communities by Western visitors before
          or during Griaule's fieldwork.

          WHAT THIS ENTRY DOCUMENTS:
          The public academic record of the Griaule claim and the van Beek
          counter-evidence. Not the truth of the astronomical knowledge itself.
        reference_sources:
          - "Griaule, M. & Dieterlen, G. (1950). A Sudanese Sirius System.
             Journal de la Société des Africanistes. [CONTESTED]"
          - "van Beek, W.E.A. (1991). Dogon Restudied. Current Anthropology.
             [KEY REFUTATION]"
        reference_urls:
          - "https://en.wikipedia.org/wiki/Dogon_people#Astronomy"
