      mythic_narrative: >
        Sigi tolo is the Dogon name for Sirius, the brightest star in the
        night sky. In Dogon tradition, Sirius is associated with Amma, the
        creator deity, and with the Sigui — the most important Dogon
        ceremony, held approximately every 60 years and involving ritual
        renewal and ancestral rites. Marcel Griaule's 1930s–1950s fieldwork
        documented detailed Dogon cosmological knowledge around Sirius,
        including claims about knowledge of Sirius's white dwarf companion
        (Sirius B, invisible to the naked eye). This sparked decades of
        popular interest and academic debate. Walter van Beek's 1991
        restudy (Current Anthropology) is the key academic counter-point:
        van Beek found that Dogon people he consulted did NOT possess the
        astronomical knowledge Griaule had reported. The prevailing academic
        view now treats Griaule's Sirius B claims with significant scepticism
        as likely post-fieldwork contamination. What is NOT contested: Sirius
        is of religious and ceremonial significance to the Dogon.
