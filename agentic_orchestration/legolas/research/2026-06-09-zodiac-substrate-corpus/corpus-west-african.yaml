      mythic_narrative: >
        Po tolo is the name Griaule's informants gave (per his 1950 publication)
        to the companion star of Sirius — described as the smallest and heaviest
        of all stars, associated symbolically with the po (millet) seed, the
        smallest grain in Dogon agriculture. Griaule mapped this to the white
        dwarf Sirius B, invisible to the naked eye. The claim that the Dogon
        possessed pre-telescopic knowledge of an invisible stellar companion
        became one of the most debated claims in 20th-century anthropology of
        knowledge. Walter van Beek's 1991 restudy published in Current
        Anthropology found no evidence of this knowledge in the same Dogon
        communities, leading to the consensus that Griaule's documentation
        was unreliable. The entry documents the academic controversy; the
        underlying cosmological framework (dense star, primordial seed
        symbolism) may reflect authentic Dogon cosmological concepts even if
        the Sirius B identification is post-hoc.
