    mythic_narrative: "The Egyptian decan system (~2400 BCE) is one of humanity's earliest systematic astronomical frameworks. Thirty-six decan star-groups each governed a 10-day period (dekad) of the 360-day Egyptian calendar. Each decan star rose heliacally (just before sunrise) to mark its period. At night, sequential rising of decans across the horizon marked the passing of hours — a star-clock for ritual and funerary navigation. The Ptolemaic Dendera zodiac (now in the Louvre) shows all 36 decans as divine figures in procession."
