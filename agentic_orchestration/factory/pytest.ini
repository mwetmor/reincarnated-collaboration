[pytest]
# The suite's SUBJECT is `tests/`, stated here rather than left to pytest's default walk.
#
# `rollback` quarantines what it refuses to undo, durably, INSIDE this tree at
# `sessions/<run>/breach/...` — and the wall's fenced trees contain test files, so the
# quarantine holds copies of `test_*.py` (plus modules that arrived through a
# symlink-out-of-tree breach). Nothing escapes containment; but `pytest` typed at this
# directory walked into the quarantine and reported 33 collection errors on artifacts
# that are supposed to be inert. `testpaths` fixes the bare invocation, `norecursedirs`
# fixes the explicit one, and tests/test_reach_audit.py plants an unparseable file where
# quarantine puts things and requires both to stay clean.
testpaths = tests
norecursedirs = sessions *.egg .* _darcs build CVS dist node_modules venv {arch}
